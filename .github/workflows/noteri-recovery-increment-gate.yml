name: Noteri recovery increment gate
on:
  push:
    branches: ['ops/noteri-recovery-gate-20261002']
    paths: ['.github/workflows/noteri-recovery-increment-gate.yml']
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  gate:
    if: github.actor == 'ericson-j-santos'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/reqsys-v2-enterprise-real
          ref: 3ee12d2db9475e3251c72f9d084ac81f75be480a
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run existing gate for the closed recovery hotfix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/coordenador_status_consolidator.py --repo ericson-j-santos/reqsys-v2-enterprise-real --branch main --output-dir artifacts/coordenador-status
          python scripts/agent_increment_gate.py --increment-type hotfix --reference OPS-GAP-NOTERI-PYTHON-20261002 --intent "Restabelecer os probes e a rota de recuperacao do PC24x7 pelo Noteri" --status-json artifacts/coordenador-status/coordenador-status.json --output-dir artifacts/agent-increment-gate --json
