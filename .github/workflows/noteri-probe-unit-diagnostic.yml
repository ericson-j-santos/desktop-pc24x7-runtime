name: Noteri probe unit diagnostic
on:
  push:
    branches: ['ops/noteri-recovery-gate-20261002']
    paths: ['.github/workflows/noteri-probe-unit-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.actor == 'ericson-j-santos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/reqsys-v2-enterprise-real
          ref: ae77fe7fe8811ef21086ff9865058640d9908aa1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2 PyYAML==6.0.3
      - run: python -m pytest tests/test_noteri_desktop_network_probe.py tests/test_noteri_desktop_dev_http_probe.py tests/test_noteri_desktop_orchestrator_runner_recovery.py tests/test_noteri_desktop_orchestrator_status_probe.py -q --tb=short
