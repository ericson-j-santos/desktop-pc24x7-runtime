name: PC24x7 Runtime Canary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/runtime-canary.yml
      - config/runtime-supervisor.example.json
      - scripts/runtime_health_supervisor.py
      - tests/test_runtime_health_supervisor.py
      - tests/test_runtime_canary_queue_watchdog.py
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    # Do not queue draft/fork workflows before their physical admission gate.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('pc24x7-runtime-canary-pr-{0}', github.event.number) || 'pc24x7-runtime-canary' }}
      cancel-in-progress: false
    name: Runner, Docker and workers canary
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Materialize governed session
        id: session
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $pythonCandidates = @(
            (Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'),
            'C:\Users\User\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe',
            'C:\Users\Windows\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          )
          $python = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $python) { throw "PYTHON_RUNTIME_NOT_FOUND: $($pythonCandidates -join '; ')" }
          $result = & $python C:\dev\chatgpt-operational-rules\scripts\session_launcher.py `
            --policy C:\dev\chatgpt-operational-rules\config\command-gateway.policy.json `
            --repo $env:GITHUB_WORKSPACE `
            --session-prefix runtime-canary `
            --correlation-id "runtime-canary-${{ github.run_id }}-${{ github.run_attempt }}" `
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' `
            --sync-ref 'origin/${{ github.event.pull_request.head.ref || github.ref_name }}' `
            --require-runner-version-preflight
          $result | Set-Content -Encoding utf8 session-launch.json
          $session = $result | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or -not $session.state_validated) {
            throw 'SESSION_LAUNCH_BLOCKED'
          }
          "target_path=$($session.target_path)" >> $env:GITHUB_OUTPUT
          "session_id=$($session.session_id)" >> $env:GITHUB_OUTPUT

      - name: Run fail-closed canary
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $runtime = Join-Path $env:LOCALAPPDATA 'DesktopPC24x7\RuntimeSupervisor'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          $pythonCandidates = @(
            (Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'),
            'C:\Users\User\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe',
            'C:\Users\Windows\.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          )
          $python = $pythonCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $python) { throw "PYTHON_RUNTIME_NOT_FOUND: $($pythonCandidates -join '; ')" }
          & $python C:\dev\chatgpt-operational-rules\scripts\command_gateway.py `
            --policy C:\dev\chatgpt-operational-rules\config\command-gateway.policy.json `
            --correlation-id "runtime-canary-${{ github.run_id }}-${{ github.run_attempt }}" `
            run `
            --cwd '${{ steps.session.outputs.target_path }}' `
            --session-id '${{ steps.session.outputs.session_id }}' `
            --risk 1 `
            --timeout 120 `
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' `
            -- python scripts/runtime_health_supervisor.py `
              --config config/runtime-supervisor.example.json `
              --state (Join-Path $runtime 'state.json') `
              --evidence (Join-Path $runtime 'canary-evidence.json')
          Copy-Item (Join-Path $runtime 'canary-evidence.json') runtime-canary-evidence.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-canary-evidence.json
            session-launch.json
          if-no-files-found: error
          retention-days: 14
  queue_watchdog:
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    name: Runtime canary queue watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    env:
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Runner, Docker and workers canary
      EXPECTED_RUNNER: DESKTOP-PDQK954-runtime
      STALL_AFTER_SECONDS: "300"
      CORRELATION_ID: runtime-canary-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Resolve canonical operational rules
        id: rules
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              branch: 'main',
            });
            const sha = String(branch.data.commit.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('RULES_SHA_UNVERIFIED');
              return;
            }
            core.setOutput('sha', sha);

      - name: Checkout canonical progress watchdog
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ steps.rules.outputs.sha }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe exact runner pickup without renewing progress
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const runId = Number(process.env.TARGET_RUN_ID);
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            // Setup/rules checkout is not time waiting for physical pickup.
            // Fix the observation anchor once; polling must never renew it.
            const anchor = new Date();
            while (true) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
                filter: 'latest',
              });
              const matches = response.data.jobs.filter(
                (item) => item.name === process.env.TARGET_JOB_NAME,
              );
              if (matches.length > 1) {
                core.setFailed('CANARY_JOB_NOT_UNIQUE');
                return;
              }
              const job = matches[0] || null;
              const pickedUp = job
                && Number.isSafeInteger(job.runner_id)
                && job.runner_id > 0
                && job.runner_name === process.env.EXPECTED_RUNNER
                && Boolean(job.started_at)
                && ['in_progress', 'completed'].includes(job.status);
              if (pickedUp) {
                const observed = new Date().toISOString();
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: String(job.id),
                  correlation_id: process.env.CORRELATION_ID,
                  state: job.status === 'completed' ? 'completed' : 'running',
                  last_material_progress_at: observed,
                  last_observation_at: observed,
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              const noProgressMs = Date.now() - anchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: job ? String(job.id) : 'runtime-canary-job-not-created',
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: anchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Fail closed and cancel stalled canary
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }
            core.setFailed(`SELF_HOSTED_RUNNER_UNAVAILABLE:${decision.no_progress_seconds}s`);
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.TARGET_RUN_ID),
            });

