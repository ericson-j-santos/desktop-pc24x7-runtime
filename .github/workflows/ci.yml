name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            check_name: Python compile and tests
          - os: ubuntu-latest
            check_name: Portable Linux compile and tests
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Record exact tested revision
        shell: pwsh
        run: git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2 PyYAML==6.0.3

      - name: Compile
        shell: pwsh
        run: python -m compileall -q scripts tests

      - name: Unit and negative-control tests
        shell: pwsh
        run: python -m pytest -ra

      - name: Admission, resume and watchdog controls without physical dispatch
        shell: pwsh
        run: |
          node --check scripts/reqsys_dev_inventory_admission.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/reqsys_dev_inventory_resume.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_reqsys_dev_inventory_admission.cjs tests/test_reqsys_dev_inventory_pickup_watchdog.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
