name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Python compile and tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Compile
        shell: pwsh
        run: python -m compileall -q scripts tests

      - name: Unit and negative-control tests
        shell: pwsh
        run: python -m pytest


  physical_runner_watchdog:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Physical runner queue watchdog
    runs-on: windows-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    env:
      RULES_SHA: ac2297988651f41ab03469808e41f83496e9c58f
      TARGET_WORKFLOW_NAME: Engineering Worker Pool Smoke DEV
      TARGET_JOB_NAME: Ensure dedicated Desktop runner labels
      STALL_AFTER_SECONDS: "300"
      CORRELATION_ID: physical-runner-watchdog-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe physical runner pickup
        id: observe
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const observationStartedAt = new Date();
            let targetRun = null;
            let targetJob = null;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event: 'pull_request',
                head_sha: process.env.TARGET_SHA,
                per_page: 100,
              });
              targetRun = data.workflow_runs
                .filter((run) => run.name === process.env.TARGET_WORKFLOW_NAME)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0] || null;

              if (targetRun) {
                core.setOutput('target_run_id', String(targetRun.id));
                if (targetRun.status === 'completed') {
                  const terminalState = targetRun.conclusion === 'cancelled' ? 'cancelled' : 'completed';
                  fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                    task_id: String(targetRun.id),
                    correlation_id: process.env.CORRELATION_ID,
                    state: terminalState,
                    last_material_progress_at: targetRun.updated_at || targetRun.created_at,
                    last_observation_at: new Date().toISOString(),
                    stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                    alternative_route_available: false,
                  }));
                  return;
                }

                const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: targetRun.id,
                  per_page: 100,
                });
                targetJob = jobsResponse.data.jobs.find(
                  (job) => job.name === process.env.TARGET_JOB_NAME,
                ) || null;

                if (
                  targetJob &&
                  (targetJob.status !== 'queued' || Number(targetJob.runner_id || 0) > 0)
                ) {
                  fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                    task_id: String(targetJob.id),
                    correlation_id: process.env.CORRELATION_ID,
                    state: targetJob.status === 'completed' ? 'completed' : 'running',
                    last_material_progress_at: new Date().toISOString(),
                    last_observation_at: new Date().toISOString(),
                    stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                    alternative_route_available: false,
                  }));
                  return;
                }
              }

              const progressAnchor = targetRun
                ? new Date(targetRun.created_at)
                : observationStartedAt;
              const noProgressMs = Date.now() - progressAnchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: targetJob ? String(targetJob.id) : (targetRun ? String(targetRun.id) : 'physical-run-not-created'),
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: progressAnchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }

              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        shell: pwsh
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Fail closed and cancel stalled physical run
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          TARGET_RUN_ID: ${{ steps.observe.outputs.target_run_id }}
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }

            const runId = Number(process.env.TARGET_RUN_ID || 0);
            if (runId > 0) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
            }
            core.setFailed(
              `SELF_HOSTED_RUNNER_UNAVAILABLE: sem progresso material por ${decision.no_progress_seconds}s`,
            );
