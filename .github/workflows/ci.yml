name: CI

on:
  push:
    branches:
      - main
      - feat/**
      - fix/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            check_name: Python compile and tests
          - os: ubuntu-latest
            check_name: Portable Linux compile and tests
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Record exact tested revision
        shell: pwsh
        run: git rev-parse HEAD

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2 PyYAML==6.0.3

      - name: Compile
        shell: pwsh
        run: python -m compileall -q scripts tests

      - name: Unit and negative-control tests
        shell: pwsh
        run: python -m pytest -ra

      - name: Admission, resume and watchdog controls without physical dispatch
        shell: pwsh
        run: |
          node --check scripts/reqsys_dev_inventory_admission.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/reqsys_dev_inventory_resume.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/test_reqsys_dev_inventory_admission.cjs tests/test_reqsys_dev_inventory_pickup_watchdog.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Synthetic hosted-only transport test. No artifact, host pickup or failover certification.
  lenovo_output_producer:
    name: Synthetic Lenovo receipt output producer (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      receipt_b64: ${{ steps.emit.outputs.receipt_b64 }}
      receipt_sha256: ${{ steps.emit.outputs.receipt_sha256 }}
    steps:
      - name: Emit bounded non-secret synthetic receipt
        id: emit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ericson-j-santos/desktop-pc24x7-runtime"
          fixture="$(jq -nc --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" '{contract:"job-output-transport-test-v1",synthetic_test_only:true,source_sha:$sha,run_id:$run,run_attempt:$attempt}')"
          test -n "$fixture"
          test "$(printf '%s' "$fixture" | wc -c)" -le 8192
          encoded="$(printf '%s' "$fixture" | base64 -w0)"
          test "${#encoded}" -le 12000
          digest="$(printf '%s' "$fixture" | sha256sum | cut -d' ' -f1)"
          echo "receipt_b64=$encoded" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$digest" >> "$GITHUB_OUTPUT"

  lenovo_output_readback:
    name: Independent synthetic job-output transport readback (hosted)
    needs: lenovo_output_producer
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RECEIPT_B64: ${{ needs.lenovo_output_producer.outputs.receipt_b64 }}
      RECEIPT_SHA256: ${{ needs.lenovo_output_producer.outputs.receipt_sha256 }}
    steps:
      - name: Validate cross-job delivery, SHA-256, bounds and negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ericson-j-santos/desktop-pc24x7-runtime"
          mkdir -p _receipt_transport

          # Every negative case exercises this same verifier, not an unrelated assertion.
          verify_transport() {
            local encoded="$1" digest="$2" expected_sha="$3" expected_run="$4" expected_attempt="$5"
            test -n "$encoded" || return 1
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            test "$(printf '%s' "$encoded" | wc -c)" -le 12000 || return 1
            printf '%s' "$encoded" | base64 --decode > _receipt_transport/checked.json || return 1
            test -s _receipt_transport/checked.json || return 1
            test "$(wc -c < _receipt_transport/checked.json)" -le 8192 || return 1
            test "$(sha256sum _receipt_transport/checked.json | cut -d' ' -f1)" = "$digest" || return 1
            jq -e --arg sha "$expected_sha" --arg run "$expected_run" --arg attempt "$expected_attempt" '
              .contract == "job-output-transport-test-v1" and
              .synthetic_test_only == true and
              .source_sha == $sha and .run_id == $run and .run_attempt == $attempt
            ' _receipt_transport/checked.json >/dev/null || return 1
          }

          expect_rejected() {
            local case_name="$1"
            shift
            if verify_transport "$@"; then
              echo "NEGATIVE_${case_name}_NOT_DETECTED" >&2
              exit 1
            fi
          }

          # Positive: provider-delivered output from another hosted job.
          verify_transport "$RECEIPT_B64" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          cp _receipt_transport/checked.json _receipt_transport/valid.json

          # Tampered bytes with the original digest.
          cp _receipt_transport/valid.json _receipt_transport/tampered.json
          printf 'x' >> _receipt_transport/tampered.json
          tampered_b64="$(base64 -w0 < _receipt_transport/tampered.json)"
          expect_rejected hash "$tampered_b64" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

          # Foreign SHA with internally consistent bytes and digest.
          jq -c '.source_sha = "0000000000000000000000000000000000000000"' _receipt_transport/valid.json > _receipt_transport/forged.json
          forged_b64="$(base64 -w0 < _receipt_transport/forged.json)"
          forged_digest="$(sha256sum _receipt_transport/forged.json | cut -d' ' -f1)"
          expect_rejected sha "$forged_b64" "$forged_digest" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          expect_rejected run "$RECEIPT_B64" "$RECEIPT_SHA256" "$GITHUB_SHA" "0" "$GITHUB_RUN_ATTEMPT"
          expect_rejected attempt "$RECEIPT_B64" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "0"
          expect_rejected missing "" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

          # Oversized decoded bytes and malformed Base64 must fail in the verifier.
          head -c 8193 /dev/zero > _receipt_transport/oversized.json
          oversize_b64="$(base64 -w0 < _receipt_transport/oversized.json)"
          oversize_digest="$(sha256sum _receipt_transport/oversized.json | cut -d' ' -f1)"
          expect_rejected size "$oversize_b64" "$oversize_digest" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          expect_rejected base64 "%%%" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

          # A replay of the immutable fixture produces no external write.
          verify_transport "$RECEIPT_B64" "$RECEIPT_SHA256" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          echo "SYNTHETIC_CROSS_JOB_TRANSPORT_OK"
