name: Desktop fixed supervisor receipt governed read-only

on:
  push:
    branches:
      - fix/pc24x7-supervisor-receipt-readonly-20261012
    paths:
      - .github/workflows/pc24x7-supervisor-receipt-readonly.yml

permissions:
  contents: read

concurrency:
  group: pc24x7-supervisor-receipt-readonly-20261012
  cancel-in-progress: true

jobs:
  contract:
    name: Validate fixed receipt negative controls
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test existing fixed collector
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile scripts/supervisor_refresh_receipt_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q tests/test_supervisor_receipt_minimal.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  inspect:
    needs: contract
    name: Physical fixed-path supervisor receipt readback
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev]
    timeout-minutes: 6
    steps:
      - name: Checkout immutable Desktop source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout pinned operational rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: f6ccb143a581e28650e9b640226f9ef671d469f2
          path: _rules
          persist-credentials: false
      - name: Bootstrap exact session, host and runner
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'PINNED_PYTHON_MISSING' }
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args = @('--policy', $policy, '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', 'receipt-readonly',
            '--correlation-id', "receipt-readonly-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            '--expected-head', $env:GITHUB_SHA,
            '--sync-ref', 'origin/fix/pc24x7-supervisor-receipt-readonly-20261012',
            '--require-runner-version-preflight')
          $raw = @(& $python $launcher @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'SESSION_LAUNCH_BLOCKED' }
          $s = @($raw)[-1] | ConvertFrom-Json
          if (($s.result -ne 'SESSION_LAUNCH_OK') -or ($s.state_validated -ne $true) -or
              ($s.head -ne $env:GITHUB_SHA) -or ($s.host -ne 'DESKTOP-PDQK954') -or
              ($s.runner_version_preflight.ok -ne $true)) { throw 'SESSION_IDENTITY_INVALID' }
          "target_path=$($s.target_path)" | Add-Content -Path $env:GITHUB_OUTPUT
          "session_id=$($s.session_id)" | Add-Content -Path $env:GITHUB_OUTPUT
      - name: Collect fixed original receipt via Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          New-Item -ItemType Directory -Force -Path 'artifacts\receipt' | Out-Null
          $evidence = [ordered]@{
            schema_version = 1
            result = 'FIXED_RECEIPT_BLOCKED'
            phase = 'not_started'
            blocker_code = 'not_checked'
            gateway_exit_code = $null
            host = 'DESKTOP-PDQK954'
            source_sha = $env:GITHUB_SHA
            runner_name = $env:RUNNER_NAME
            expected_correlation_id = 'desktop-crlf-refresh-20261008-2116'
            expected_target_sha = '0426ea5283a511e7e98b8396e65fc6cf6cb1e620'
            read_only = $true
            recovered = $false
            production_touched = $false
            authoritative_success = $false
            origin_cryptographically_attested = $false
          }
          try {
            $evidence.phase = 'runner_identity'
            $evidence.blocker_code = 'runner_identity_invalid'
            if ($env:RUNNER_NAME -ne 'DESKTOP-PDQK954-runtime') { throw 'RUNNER_IDENTITY_MISMATCH' }
            $gatewayArgs = @('--policy', $policy, '--correlation-id', "fixed-receipt-$env:GITHUB_RUN_ID",
              'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
              '--risk', '1', '--timeout', '30', '--expected-head', $env:GITHUB_SHA,
              '--', 'python', 'scripts/supervisor_refresh_receipt_probe.py',
              '--confirm', 'READ-RECORDED-SUPERVISOR-REFRESH')
            $evidence.phase = 'gateway_invocation'
            $evidence.blocker_code = 'gateway_response_missing'
            $raw = @(& $python $gateway @gatewayArgs)
            $exitCode = $LASTEXITCODE
            if (-not $raw) { throw 'GATEWAY_RESPONSE_MISSING' }
            $event = @($raw)[-1] | ConvertFrom-Json
            $evidence.phase = 'gateway_response'
            if ($null -ne $event.gateway_exit_code) {
              $evidence.gateway_exit_code = [int]$event.gateway_exit_code
            }
            if (($exitCode -ne 0) -or ($event.gateway_exit_code -ne 0) -or
                ($event.state_changed -ne $false) -or ($event.result -ne 'ok')) {
              $evidence.blocker_code = 'gateway_or_collector_failed'
              if ($event.stdout) {
                try {
                  $safe = ([string]$event.stdout) | ConvertFrom-Json
                  if ($safe.result -eq 'SUPERVISOR_RECEIPT_BLOCKED') {
                    $evidence.blocker_code = 'collector_returned_blocked'
                    $codes = @('matching_receipt_missing', 'receipt_identity_mismatch',
                      'ambiguous_receipts', 'host_not_authorized', 'receipt_invalid',
                      'receipt_file_missing', 'receipt_access_denied',
                      'receipt_io_or_format_error')
                    if ([string]$safe.blocker_code -in $codes) {
                      $evidence.collector_code = [string]$safe.blocker_code
                    }
                  }
                } catch {}
              }
              throw 'FIXED_RECEIPT_NOT_OBSERVED'
            }
            $evidence.phase = 'collector_contract'
            $evidence.blocker_code = 'collector_contract_invalid'
            $receipt = ([string]$event.stdout) | ConvertFrom-Json
            if (($receipt.result -ne 'SUPERVISOR_RECEIPT_OBSERVED') -or
                ($receipt.host -ne 'DESKTOP-PDQK954') -or
                ($receipt.correlation_id -ne $evidence.expected_correlation_id) -or
                ($receipt.target_sha -ne $evidence.expected_target_sha) -or
                ($receipt.read_only -ne $true) -or
                ($receipt.recovery_allowed -ne $false) -or
                ($receipt.authoritative_success -ne $false) -or
                ($receipt.trust -ne 'local_collection_unattested')) {
              throw 'FIXED_RECEIPT_CONTRACT_INVALID'
            }
            $evidence.result = 'FIXED_RECEIPT_OBSERVED'
            $evidence.phase = 'completed'
            $evidence.blocker_code = 'none'
            $evidence.receipt_state = [string]$receipt.receipt_state
            $evidence.receipt_sha256 = [string]$receipt.receipt_sha256
            $evidence.receipt_at_epoch = $receipt.receipt_at_epoch
            if ($null -ne $receipt.error_code) { $evidence.error_code = [string]$receipt.error_code }
            if ($null -ne $receipt.error_type) { $evidence.error_type = [string]$receipt.error_type }
          } catch {
            $evidence.blocker = 'governed_fixed_receipt_readback_unavailable'
          }
          $evidence | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 'artifacts\receipt\result.json'
          Write-Host "FIXED_RECEIPT_RESULT=$($evidence.result)"
          if ($evidence.result -ne 'FIXED_RECEIPT_OBSERVED') { throw 'FIXED_RECEIPT_BLOCKED' }
      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-supervisor-receipt-readonly
          path: artifacts/receipt/result.json
          if-no-files-found: warn
          retention-days: 7
