name: ReqSys self-hosted DEV controlled preparation

on:
  workflow_dispatch:
  push:
    branches: [fix/reqsys-self-hosted-dev-prepare-20261003]
    paths:
      - scripts/reqsys_self_hosted_dev_preflight.py
      - .github/workflows/reqsys-self-hosted-dev-cutover.yml

permissions:
  contents: read

concurrency:
  group: reqsys-dev-selfhosted-physical

  cancel-in-progress: false

jobs:
  resolve_rules:
    name: Resolve canonical operational rules
    runs-on: windows-latest
    timeout-minutes: 2
    outputs:
      rules_sha: ${{ steps.rules.outputs.sha }}
    steps:
      - name: Resolve main SHA and require rules 1.6.9+
        id: rules
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              branch: 'main',
            });
            const sha = branch.data.commit.sha;
            const readme = await github.rest.repos.getContent({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              path: 'README.md',
              ref: sha,
            });
            const text = Buffer.from(readme.data.content, 'base64').toString('utf8');
            const match = text.match(/^Versão:\s*(\d+)\.(\d+)\.(\d+)\s*$/m);
            if (!match) {
              core.setFailed('RULES_VERSION_UNREADABLE');
              return;
            }
            const observed = match.slice(1).map(Number);
            const required = [1, 6, 9];
            const sufficient = observed[0] > required[0]
              || (observed[0] === required[0] && observed[1] > required[1])
              || (observed[0] === required[0] && observed[1] === required[1] && observed[2] >= required[2]);
            if (!sufficient) {
              core.setFailed(`RULES_1_6_9_REQUIRED:observed=${observed.join('.')}`);
              return;
            }
            core.setOutput('sha', sha);

  contract_linux:
    name: Real PostgreSQL restore and ciphertext controls
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: reqsys-ci-disposable
          POSTGRES_DB: reqsys_importer_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d reqsys_importer_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/reqsys-v2-enterprise-real
          ref: a91f4553da886e21afd439c51fb2242d13881b09
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install declared validation dependencies
        run: |
          python -m pip install --only-binary=:all: pytest==8.4.2 SQLAlchemy==2.0.43 psycopg2-binary==2.9.10 cryptography==46.0.2
      - name: Run real database restore and negative controls
        env:
          REQSYS_IMPORTER_TEST_DATABASE_URL: postgresql+psycopg2://postgres:reqsys-ci-disposable@127.0.0.1:5432/reqsys_importer_test
        run: python -m pytest tests/test_import_self_hosted_dev_sqlite.py tests/test_dev_backup_transport.py tests/test_reqsys_self_hosted_dev_publish.py tests/test_run_self_hosted_dev_owner_action.py tests/test_self_hosted_dev_maintenance.py tests/test_pc24x7_dev_runtime_supervisor.py -q

  contract_windows:
    name: Windows private ACL and configuration controls
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/reqsys-v2-enterprise-real
          ref: a91f4553da886e21afd439c51fb2242d13881b09
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary=:all: pytest==8.4.2 cryptography==46.0.2 pywin32==311
      - run: python -m pytest tests/test_reqsys_self_hosted_dev_publish.py tests/test_dev_backup_transport.py tests/test_run_self_hosted_dev_owner_action.py tests/test_self_hosted_dev_maintenance.py tests/test_pc24x7_dev_runtime_supervisor.py -q
  e2e:
    needs: [resolve_rules, contract_linux, contract_windows]
    name: Prepare isolated DEV through the fixed Desktop executor
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev]
    timeout-minutes: 20
    env:
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      REQSYS_TARGET_SHA: a91f4553da886e21afd439c51fb2242d13881b09
      PYTHONPATH: ${{ github.workspace }}
      CORRELATION_ID: reqsys-dev-prepare-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts/reqsys-dev-prepare-e2e/evidence.json
    steps:
      - name: Checkout exact runtime SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed session and runner version preflight
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-runner",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef,
            "--require-runner-version-preflight"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          if ($null -eq $data.runner_version_preflight -or $data.runner_version_preflight.ok -ne $true) {
            throw "RUNNER_VERSION_PREFLIGHT_BLOCKED"
          }
          if ([string]::IsNullOrWhiteSpace([string]$data.runner_version_preflight.installed_version)) {
            throw "RUNNER_VERSION_EVIDENCE_MISSING"
          }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT
          "runner_version=$($data.runner_version_preflight.installed_version)" | Add-Content $env:GITHUB_OUTPUT
          "RUNNER_VERSION_OBSERVED=$($data.runner_version_preflight.installed_version)" | Add-Content $env:GITHUB_ENV
          "RUNNER_REGISTRATION_SUPPORTED=$($data.runner_version_preflight.registration_supported.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          "RUNNER_RUNTIME_SUPPORTED=$($data.runner_version_preflight.runtime_supported_now.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          "RUNNER_DEPRECATION_API_STATUS=$($data.runner_version_preflight.deprecation_api_status)" | Add-Content $env:GITHUB_ENV

      - name: Inspect the database serving the existing DEV before migration
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $probe = Join-Path "${{ steps.session.outputs.target_path }}" "scripts\reqsys_dev_current_data_probe.py"
          $evidence = Join-Path $env:RUNNER_TEMP ("reqsys-current-dev-data-" + $env:GITHUB_RUN_ID + "\evidence.json")
          "CURRENT_DEV_EVIDENCE_FILE=$evidence" | Add-Content $env:GITHUB_ENV
          & python $gateway --policy $policy --correlation-id "$env:CORRELATION_ID-current-data" run --cwd "${{ steps.session.outputs.target_path }}" --session-id "${{ steps.session.outputs.session_id }}" --risk 1 --timeout 120 --expected-head "${{ steps.session.outputs.anchor_sha }}" -- python $probe --evidence-file $evidence
          exit $LASTEXITCODE

      - name: Upload current DEV metadata only
        if: always() && env.CURRENT_DEV_EVIDENCE_FILE != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reqsys-current-dev-data-${{ github.run_id }}
          path: ${{ env.CURRENT_DEV_EVIDENCE_FILE }}
          if-no-files-found: warn
          retention-days: 7
      - name: Materialize the fixed ReqSys DEV source through Command Gateway
        id: reqsys_source
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $sourceScript = Join-Path $env:TARGET_PATH "scripts\materialize_reqsys_self_hosted_dev_source.py"
          $args = @("--policy",$policy,"--correlation-id",$env:CORRELATION_ID,"run",
            "--cwd",$env:TARGET_PATH,"--session-id",$env:SESSION_ID,"--risk","2","--timeout","300",
            "--expected-head",$env:ANCHOR_SHA,"--","python",$sourceScript,"--expected-sha",$env:REQSYS_TARGET_SHA)
          & python $gateway @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = "C:\dev\chatgpt-workers\rs2-$env:REQSYS_TARGET_SHA"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $raw = & python $launcher --policy $policy --repo $source --session-prefix reqsys-dev-prepare --correlation-id "$env:CORRELATION_ID-reqsys" --expected-head $env:REQSYS_TARGET_SHA --sync-ref origin/fix/self-hosted-dev-restore-20261003 --require-runner-version-preflight
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true -or $data.head -ne $env:REQSYS_TARGET_SHA) { throw "REQSYS_SESSION_BLOCKED" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Install isolated migration dependencies through Command Gateway
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $site = Join-Path $env:RUNNER_TEMP ("reqsys-migration-python-" + $env:GITHUB_RUN_ID)
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          & python $gateway --policy $policy --correlation-id "$env:CORRELATION_ID-deps" run --cwd "${{ steps.reqsys_source.outputs.target_path }}" --session-id "${{ steps.reqsys_source.outputs.session_id }}" --risk 2 --timeout 240 --expected-head $env:REQSYS_TARGET_SHA -- python -m pip --isolated install --only-binary=:all: --no-user --target $site --index-url https://pypi.org/simple cryptography==46.0.2 pywin32==311
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PYTHONPATH=$site" | Add-Content $env:GITHUB_ENV
          "REQSYS_MIGRATION_DEPENDENCIES=$site" | Add-Content $env:GITHUB_ENV

      - name: Review the narrow owner action plan without applying grants
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $registry = Join-Path "${{ steps.session.outputs.target_path }}" "scripts\register_reqsys_dev_owner_actions.py"
          $source = "C:\dev\chatgpt-workers\rs2-$env:REQSYS_TARGET_SHA"
          $prepareSha = (Get-FileHash (Join-Path $source "scripts\reqsys_self_hosted_dev_publish.py") -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherSha = (Get-FileHash (Join-Path $source "scripts\run_self_hosted_dev_owner_action.py") -Algorithm SHA256).Hash.ToLowerInvariant()
          & python $gateway --policy $policy --correlation-id "$env:CORRELATION_ID-owner-plan" run --cwd "${{ steps.session.outputs.target_path }}" --session-id "${{ steps.session.outputs.session_id }}" --risk 1 --timeout 120 --expected-head "${{ steps.session.outputs.anchor_sha }}" -- python $registry --source-sha $env:REQSYS_TARGET_SHA --prepare-script-sha256 $prepareSha --launcher-script-sha256 $launcherSha
          exit $LASTEXITCODE

  queue_watchdog:
    needs: [resolve_rules, contract_linux, contract_windows]
    name: Dedicated runner queue watchdog
    runs-on: windows-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    env:
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Prepare isolated DEV through the fixed Desktop executor
      STALL_AFTER_SECONDS: "60"
      CORRELATION_ID: reqsys-dev-prepare-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe dedicated runner pickup
        id: observe
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const runId = Number(process.env.TARGET_RUN_ID);
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const anchor = new Date();
            while (true) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const job = response.data.jobs.find((item) => item.name === process.env.TARGET_JOB_NAME) || null;
              if (job && (job.status !== 'queued' || Number(job.runner_id || 0) > 0)) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: String(job.id),
                  correlation_id: process.env.CORRELATION_ID,
                  state: job.status === 'completed' ? 'completed' : 'running',
                  last_material_progress_at: new Date().toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              const noProgressMs = Date.now() - anchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: job ? String(job.id) : 'reqsys-dev-prepare-job-not-created',
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: anchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        shell: pwsh
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Fail closed and cancel stalled canary
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }
            core.setFailed(`SELF_HOSTED_RUNNER_UNAVAILABLE:${decision.no_progress_seconds}s`);
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.TARGET_RUN_ID),
            });

