name: Ollama CPU Pilot DEV (manual + gated PR preflight + owner issue inventory)

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [ready_for_review, edited]
    branches: [main]
    paths:
      - .github/workflows/ollama-cpu-pilot-dev.yml
      - scripts/ollama_cpu_pilot.py
      - tests/test_ollama_cpu_pilot.py
  workflow_dispatch:
    inputs:
      mode:
        description: "Inventory checks local weights; smoke makes one bounded inference"
        required: true
        type: choice
        default: inventory
        options:
          - inventory
          - smoke
      candidate_sha:
        description: "Required for DEV draft-PR inventory: exact reviewed full SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('ollama-comment-{0}', github.event.comment.id) || format('ollama-cpu-pilot-dev-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

jobs:
  resolve_rules:
    name: Resolve canonical rules once (read-only)
    if: >-
      github.actor == 'ericson-j-santos' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' &&
         inputs.mode == 'inventory' && inputs.candidate_sha == github.sha) ||
        (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'feat/ollama-cpu-pilot-dev-20261024' &&
         github.event.pull_request.draft == false) ||
        (github.event_name == 'pull_request' && github.event.action == 'edited' &&
         github.event.pull_request.number == 138 &&
         github.event.pull_request.draft == true &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'fix/ollama-current-rules-admission-todo39-20261105' &&
         github.event.changes.body.from != null &&
         contains(github.event.pull_request.body, 'TODO39_AUTOPREFLIGHT_ONCE_') &&
         !contains(github.event.changes.body.from, 'TODO39_AUTOPREFLIGHT_ONCE_')) ||
        (github.event_name == 'issue_comment' && github.event.action == 'created' &&
         github.event.issue.number == 31 && !github.event.issue.pull_request &&
         github.event.comment.user.login == 'ericson-j-santos' &&
         startsWith(github.event.comment.body, 'TODO39_INVENTORY_ONCE_'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
      checks: read
      issues: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Read current canonical rules SHA
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              branch: 'main',
            });
            const sha = String(result.data.commit.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              core.setFailed('OLLAMA_RULES_SHA_UNVERIFIED');
              return;
            }
            if (context.eventName === 'workflow_dispatch' &&
                context.ref !== 'refs/heads/main') {
              const ref = String(context.ref || '');
              const expected = String(context.payload.inputs?.candidate_sha || '').toLowerCase();
              const candidate = String(context.sha || '').toLowerCase();
              if (!ref.startsWith('refs/heads/') ||
                  !/^[0-9a-f]{40}$/.test(expected) ||
                  candidate !== expected ||
                  context.repo.owner !== 'ericson-j-santos' ||
                  context.repo.repo !== 'desktop-pc24x7-runtime') {
                core.setFailed('OLLAMA_CANDIDATE_SHA_UNVERIFIED');
                return;
              }
              const branch = ref.slice('refs/heads/'.length);
              const [active, main, prs] = await Promise.all([
                github.rest.repos.getBranch({
                  owner: context.repo.owner, repo: context.repo.repo, branch,
                }),
                github.rest.repos.getBranch({
                  owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
                }),
                github.rest.pulls.list({
                  owner: context.repo.owner, repo: context.repo.repo,
                  state: 'open', head: context.repo.owner + ':' + branch, per_page: 100,
                }),
              ]);
              const matches = prs.data.filter(pr =>
                pr.state === 'open' && pr.draft === true &&
                pr.head?.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
                pr.head?.ref === branch && pr.head?.sha === candidate &&
                pr.base?.ref === 'main' && pr.base?.sha === main.data.commit.sha);
              if (active.data.commit.sha !== candidate || matches.length !== 1 ||
                  prs.data.length !== 1) {
                core.setFailed('OLLAMA_DRAFT_PR_OR_BASE_DRIFT');
                return;
              }
              core.info('OLLAMA_DRAFT_INVENTORY_ADMITTED:' + candidate);
            }
            if (context.eventName === 'pull_request' &&
                context.payload.action === 'edited') {
              const candidate = String(context.payload.pull_request?.head?.sha || '').toLowerCase();
              const marker = 'TODO39_AUTOPREFLIGHT_ONCE_' + candidate;
              const oldBody = context.payload.changes?.body?.from;
              if (!/^[0-9a-f]{40}$/.test(candidate) ||
                  context.payload.pull_request?.number !== 138 ||
                  typeof oldBody !== 'string' ||
                  oldBody.includes('TODO39_AUTOPREFLIGHT_ONCE_') ||
                  !String(context.payload.pull_request?.body || '').includes(marker)) {
                core.setFailed('OLLAMA_PREFLIGHT_ONE_SHOT_INVALID');
                return;
              }
              const [prResp, mainResp, branchResp, checksResp, repoResp] = await Promise.all([
                github.rest.pulls.get({
                  owner: context.repo.owner, repo: context.repo.repo, pull_number: 138,
                }),
                github.rest.repos.getBranch({
                  owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
                }),
                github.rest.repos.getBranch({
                  owner: context.repo.owner, repo: context.repo.repo,
                  branch: 'fix/ollama-current-rules-admission-todo39-20261105',
                }),
                github.rest.checks.listForRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: candidate, per_page: 100,
                }),
                github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo }),
              ]);
              const pr = prResp.data;
              const required = ['Python compile and tests', 'Portable Linux compile and tests'];
              const passed = name => checksResp.data.check_runs.some(check =>
                check.name === name && check.head_sha === candidate &&
                check.status === 'completed' && check.conclusion === 'success' &&
                check.started_at && check.completed_at);
              if (pr.state !== 'open' || !pr.draft || pr.number !== 138 ||
                  pr.user?.login !== 'ericson-j-santos' ||
                  pr.head?.sha !== candidate ||
                  pr.head?.ref !== 'fix/ollama-current-rules-admission-todo39-20261105' ||
                  pr.head?.repo?.full_name !== context.repo.owner + '/' + context.repo.repo ||
                  pr.base?.ref !== 'main' ||
                  pr.base?.sha !== mainResp.data.commit.sha ||
                  branchResp.data.commit.sha !== candidate ||
                  !String(pr.body || '').includes(marker) ||
                  repoResp.data.private !== false || !required.every(passed)) {
                core.setFailed('OLLAMA_PREFLIGHT_PR_CI_OR_COST_UNVERIFIED');
                return;
              }
              core.info('TODO39_HOSTED_PREFLIGHT_ONLY:' + candidate +
                ':RULES_SHA=' + sha +
                ':NO_PHYSICAL_DISPATCH:NO_MODEL_INFERENCE');
            }
            if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment || {};
              const issue = context.payload.issue || {};
              const body = String(comment.body || '');
              const match = /^TODO39_INVENTORY_ONCE_([0-9a-f]{40})_([1-9][0-9]*)$/.exec(body);
              const sha = String(context.sha || '').toLowerCase();
              const runId = match ? Number(match[2]) : NaN;
              if (context.actor !== 'ericson-j-santos' ||
                  context.ref !== 'refs/heads/main' || context.payload.action !== 'created' ||
                  issue.number !== 31 || issue.pull_request ||
                  comment.user?.login !== context.actor ||
                  process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                  !Number.isSafeInteger(comment.id) || comment.id <= 0 ||
                  !match || match[1] !== sha || !Number.isSafeInteger(runId) || runId <= 0) {
                core.setFailed('TODO39_COMMENT_SCOPE_INVALID');
                return;
              }
              const source = {owner: context.repo.owner, repo: context.repo.repo};
              const [main, repo, comments, checks, canary, ciHistory] = await Promise.all([
                github.rest.repos.getBranch({...source, branch: 'main'}),
                github.rest.repos.get(source),
                github.paginate(github.rest.issues.listComments, {
                  ...source, issue_number: 31, per_page: 100,
                }),
                github.rest.checks.listForRef({...source, ref: sha, per_page: 100}),
                github.rest.actions.getWorkflowRun({...source, run_id: runId}),
                github.rest.actions.listWorkflowRuns({
                  ...source, workflow_id: 'ci.yml', branch: 'main',
                  head_sha: sha, event: 'push', per_page: 100,
                }),
              ]);
              const matches = comments.filter(item => item.body === body);
              const required = ['Python compile and tests', 'Portable Linux compile and tests'];
              const passed = name => checks.data.check_runs.some(check =>
                check.name === name && check.head_sha === sha &&
                check.status === 'completed' && check.conclusion === 'success' &&
                check.started_at && check.completed_at);
              const runs = ciHistory.data.workflow_runs.filter(item =>
                item.name === 'CI' && item.event === 'push' &&
                item.head_sha === sha && item.head_branch === 'main');
              runs.sort((a,b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
              const latestCi = runs[0];
              const run = canary.data;
              const age = Date.now() - Date.parse(run.updated_at);
              const fresh = Number.isFinite(age) && age >= -60000 &&
                age <= 4 * 60 * 60 * 1000;
              if (main.data.commit.sha !== sha || repo.data.private !== false ||
                  matches.length !== 1 || matches[0].id !== comment.id ||
                  !required.every(passed) || !latestCi ||
                  latestCi.status !== 'completed' ||
                  latestCi.conclusion !== 'success' || run.id !== runId ||
                  run.name !== 'PC24x7 Runtime Canary' || run.event !== 'schedule' ||
                  run.head_sha !== sha || run.status !== 'completed' ||
                  run.conclusion !== 'success' || !fresh) {
                core.setFailed('TODO39_CI_COST_OR_CANARY_UNVERIFIED');
                return;
              }
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                ...source, run_id: runId, per_page: 100,
              });
              const proved = jobs.data.jobs.filter(job =>
                job.name === 'Runner, Docker and workers canary' &&
                job.status === 'completed' && job.conclusion === 'success' &&
                job.runner_name === 'DESKTOP-PDQK954-runtime' &&
                Number.isSafeInteger(job.runner_id) && job.runner_id > 0 &&
                job.started_at && job.completed_at);
              if (proved.length !== 1) {
                core.setFailed('TODO39_RUNNER_PICKUP_UNVERIFIED');
                return;
              }
              core.info('TODO39_INVENTORY_ADMITTED:' + sha +
                ':CANARY=' + runId + ':COMMENT=' + comment.id +
                ':NO_INFERENCE:NO_DOCKER:NO_INSTALL');
            }
            core.setOutput('sha', sha);

  pilot:
    needs: resolve_rules
    if: >-
      needs.resolve_rules.result == 'success' &&
      github.event.action != 'edited'
    name: Read-only local Ollama CPU pilot
    permissions:
      contents: read
      issues: read
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 5
    env:
      TARGET_REPO: C:\\dev\\reqsys-v2-enterprise-real
      CORRELATION_ID: ollama-cpu-pilot-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Assert exact authorized Desktop host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "DESKTOP_HOST_MISMATCH"
          }

      - name: Checkout pilot exact reviewed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ needs.resolve_rules.outputs.sha }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck rules main has not drifted before bootstrap
        uses: actions/github-script@v7
        env:
          EXPECTED_RULES_SHA: ${{ needs.resolve_rules.outputs.sha }}
        with:
          script: |
            const expected = String(process.env.EXPECTED_RULES_SHA || '').toLowerCase();
            const response = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              branch: 'main',
            });
            const observed = String(response.data.commit.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(expected) ||
                !/^[0-9a-f]{40}$/.test(observed) || expected !== observed) {
              core.setFailed('OLLAMA_RULES_SHA_DRIFT');
              return;
            }
            core.info('OLLAMA_CANONICAL_RULES_VERIFIED:' + expected);

      - name: Recheck draft candidate PR before bootstrap
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const candidate = String(context.sha || '').toLowerCase();
            const expected = String(context.payload.inputs?.candidate_sha || '').toLowerCase();
            const ref = String(context.ref || '');
            if (!/^[0-9a-f]{40}$/.test(candidate) || candidate !== expected ||
                !ref.startsWith('refs/heads/') ||
                context.repo.owner !== 'ericson-j-santos' ||
                context.repo.repo !== 'desktop-pc24x7-runtime') {
              core.setFailed('OLLAMA_CANDIDATE_SHA_DRIFT_AT_BOOTSTRAP');
              return;
            }
            const branch = ref.slice('refs/heads/'.length);
            const [active, main, prs] = await Promise.all([
              github.rest.repos.getBranch({
                owner: context.repo.owner, repo: context.repo.repo, branch,
              }),
              github.rest.repos.getBranch({
                owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
              }),
              github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', head: context.repo.owner + ':' + branch, per_page: 100,
              }),
            ]);
            const approved = prs.data.filter(pr =>
              pr.state === 'open' && pr.draft === true &&
              pr.head?.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pr.head?.ref === branch && pr.head?.sha === candidate &&
              pr.base?.ref === 'main' && pr.base?.sha === main.data.commit.sha);
            if (active.data.commit.sha !== candidate || prs.data.length !== 1 ||
                approved.length !== 1) {
              core.setFailed('OLLAMA_DRAFT_PR_DRIFT_AT_BOOTSTRAP');
              return;
            }
            core.info('OLLAMA_DRAFT_PR_BOOTSTRAP_SHA_VERIFIED:' + candidate);

      - name: Recheck owner issue comment at physical pickup
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const expected = String(context.sha || '').toLowerCase();
            const eventComment = context.payload.comment || {};
            const commentId = Number(eventComment.id || 0);
            if (process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                !Number.isSafeInteger(commentId) || commentId <= 0 ||
                !String(eventComment.body || '').startsWith('TODO39_INVENTORY_ONCE_')) {
              core.setFailed('TODO39_PICKUP_COMMENT_INVALID');
              return;
            }
            const source = {owner: context.repo.owner, repo: context.repo.repo};
            const [main, comment] = await Promise.all([
              github.rest.repos.getBranch({...source, branch: 'main'}),
              github.rest.issues.getComment({...source, comment_id: commentId}),
            ]);
            if (main.data.commit.sha !== expected ||
                comment.data.id !== commentId ||
                comment.data.body !== eventComment.body ||
                comment.data.user?.login !== 'ericson-j-santos') {
              core.setFailed('TODO39_PICKUP_SHA_OR_COMMENT_DRIFT');
              return;
            }
            core.info('TODO39_CURRENT_MAIN_VERIFIED:' + expected);

      - name: Resolve ReqSys main SHA for governed read-only session
        id: anchor
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'reqsys-v2-enterprise-real',
              branch: 'main'
            });
            core.setOutput('sha', data.commit.sha);

      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ steps.anchor.outputs.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "ollama-cpu",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = (@($raw)[-1] | ConvertFrom-Json)
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Execute bounded local CPU pilot through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          PILOT_MODE: ${{ github.event_name == 'issue_comment' && 'inventory' || github.event_name == 'pull_request' && 'smoke' || inputs.mode }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:PILOT_MODE -notin @("inventory", "smoke")) { throw "INVALID_PILOT_MODE" }
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $pilot = Join-Path $env:GITHUB_WORKSPACE "scripts\ollama_cpu_pilot.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "200",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $pilot,
            "--mode", $env:PILOT_MODE,
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

  physical_runner_watchdog:
    needs: resolve_rules
    if: >-
      needs.resolve_rules.result == 'success' &&
      github.event.action != 'edited'
    name: Physical runner queue watchdog
    runs-on: windows-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    env:
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Read-only local Ollama CPU pilot
      STALL_AFTER_SECONDS: "60"
      CORRELATION_ID: ollama-cpu-pilot-watchdog-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ needs.resolve_rules.outputs.sha }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe physical runner pickup
        id: observe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const runId = Number(process.env.TARGET_RUN_ID);
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('PHYSICAL_RUN_ID_INVALID');
              return;
            }

            const progressAnchor = new Date();

            while (true) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const targetJob = jobsResponse.data.jobs.find(
                (job) => job.name === process.env.TARGET_JOB_NAME,
              ) || null;

              if (
                targetJob &&
                (targetJob.status !== 'queued' || Number(targetJob.runner_id || 0) > 0)
              ) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: String(targetJob.id),
                  correlation_id: process.env.CORRELATION_ID,
                  state: targetJob.status === 'completed' ? 'completed' : 'running',
                  last_material_progress_at: new Date().toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }

              const noProgressMs = Date.now() - progressAnchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: targetJob ? String(targetJob.id) : 'physical-runner-job-not-created',
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: progressAnchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }

              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        shell: pwsh
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Fail closed and cancel stalled physical run
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }

            core.setFailed(
              `SELF_HOSTED_RUNNER_UNAVAILABLE: sem progresso material por ${decision.no_progress_seconds}s`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.TARGET_RUN_ID),
            });
