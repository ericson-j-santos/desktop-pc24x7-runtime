name: Agentic RAG Dell Physical DEV (read-only)

on:
  pull_request:
    types: [edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dell-rag-physical-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  admission:
    name: Owner SHA and CI admission for Dell RAG
    if: >-
      github.event.action == 'edited' &&
      github.actor == 'ericson-j-santos' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/agentic-rag-physical-readonly-20261025' &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, 'OWNER_RAG_DELL_READONLY_20261025_GIT_CONFIG_REPAIR_ONCE') &&
      github.event.changes.body.from != null &&
      !contains(github.event.changes.body.from, 'OWNER_RAG_DELL_READONLY_20261025_GIT_CONFIG_REPAIR_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      checks: read
      pull-requests: read
      actions: read
    env:
      WORKER_SHA: cb42568c4b70faa0e3e05bb49d5a6e41b884281f
      AGENT_SHA: 1fc032d4c412bdb4ed202cf1193caf0cb49490ce
      WORKER_CI_RUN: "40213815929"
    steps:
      - name: Verify exact head, scope and executed upstream gates
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const eventPr = context.payload.pull_request;
            if (!eventPr || eventPr.state !== 'open' || eventPr.draft !== true) {
              core.setFailed('RAG_PR_EVENT_INVALID'); return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: eventPr.number
            });
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            const expectedBranch = 'feat/agentic-rag-physical-readonly-20261025';
            if (pr.state !== 'open' || pr.draft !== true ||
                pr.user?.login !== 'ericson-j-santos' ||
                pr.head.repo?.full_name !== owner + '/' + repo ||
                pr.head.ref !== expectedBranch ||
                pr.head.sha !== eventPr.head.sha ||
                pr.base.ref !== 'main' ||
                pr.base.sha !== main.commit.sha ||
                !pr.body?.includes('OWNER_RAG_DELL_READONLY_20261025_GIT_CONFIG_REPAIR_ONCE')) {
              core.setFailed('RAG_PR_OR_BASE_CHANGED'); return;
            }
            const { data: changes } = await github.rest.pulls.listFiles({
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const allowed = new Set([
              '.github/workflows/agentic-rag-physical-dev.yml',
              'scripts/agentic_rag_physical_readonly.py',
              'tests/test_agentic_rag_physical_readonly.py',
              'docs/AGENTIC_RAG_PHYSICAL_DEV.md'
            ]);
            if (changes.length !== allowed.size ||
                !changes.every(f => allowed.has(f.filename) &&
                                ['added','modified'].includes(f.status))) {
              core.setFailed('RAG_WORKTREE_SCOPE_UNAUTHORIZED'); return;
            }
            const { data: runtimeChecks } = await github.rest.checks.listForRef({
              owner, repo, ref: pr.head.sha, per_page: 100
            });
            function executed(checks, name, sha) {
              return checks.some(c => c.name === name &&
                c.head_sha === sha && c.status === 'completed' &&
                c.conclusion === 'success' && c.started_at && c.completed_at);
            }
            const required = ['Python compile and tests', 'Portable Linux compile and tests'];
            if (!required.every(n => executed(runtimeChecks.check_runs,n,pr.head.sha))) {
              core.setFailed('RAG_RUNTIME_CI_NOT_PROVED'); return;
            }
            const wOwner = 'ericson-j-santos', wRepo = 'engineering-worker-pool';
            const [workerPR, workerRun, agentBranch, workerMain] = await Promise.all([
              github.rest.pulls.get({owner:wOwner, repo:wRepo, pull_number:49}),
              github.rest.actions.getWorkflowRun({
                owner:wOwner, repo:wRepo, run_id:Number(process.env.WORKER_CI_RUN)
              }),
              github.rest.repos.getBranch({
                owner:wOwner, repo:'agent-core', branch:'main'
              }),
              github.rest.repos.getBranch({
                owner:wOwner, repo:wRepo, branch:'main'
              })
            ]);
            const mergedSha = '743eb08cc73d0fcfa4a5886d1641755a2ea98e7b';
            if (workerPR.data.state !== 'closed' ||
                workerPR.data.merged !== true ||
                workerPR.data.head.sha !== process.env.WORKER_SHA ||
                workerPR.data.merge_commit_sha !== mergedSha ||
                workerMain.data.commit.sha !== mergedSha ||
                workerRun.data.head_sha !== process.env.WORKER_SHA ||
                workerRun.data.status !== 'completed' ||
                workerRun.data.conclusion !== 'success' ||
                agentBranch.data.commit.sha !== process.env.AGENT_SHA) {
              core.setFailed('RAG_UPSTREAM_SHA_OR_CI_DRIFT'); return;
            }
            const [sourceCommit, mergedCommit] = await Promise.all([
              github.rest.git.getCommit({
                owner:wOwner,repo:wRepo,commit_sha:process.env.WORKER_SHA
              }),
              github.rest.git.getCommit({
                owner:wOwner,repo:wRepo,commit_sha:mergedSha
              })
            ]);
            if (sourceCommit.data.tree.sha !== mergedCommit.data.tree.sha ||
                mergedCommit.data.parents.length !== 2 ||
                mergedCommit.data.parents[1].sha !== process.env.WORKER_SHA) {
              core.setFailed('RAG_UPSTREAM_MERGED_TREE_DRIFT'); return;
            }
            const { data: workerJobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner:wOwner, repo:wRepo, run_id:Number(process.env.WORKER_CI_RUN),
              per_page:100
            });
            const requiredWorkerSteps = [
              'Test',
              'Execute pinned Agent Core RAG contract tests',
              'Real GitHub evidence to native local Qwen7B E2E (read-only)',
              'Repair real structured function in governed copy'
            ];
            const verified = workerJobs.jobs.some(job =>
              job.name === 'test' && job.status === 'completed' &&
              job.conclusion === 'success' && requiredWorkerSteps.every(name =>
                job.steps?.some(s => s.name === name &&
                  s.status === 'completed' && s.conclusion === 'success')
              )
            );
            if (!verified) {
              core.setFailed('RAG_UPSTREAM_MODEL_E2E_NOT_EXECUTED'); return;
            }
            core.info(JSON.stringify({
              result:'RAG_PHYSICAL_ADMISSION_OK',
              runtime_sha:pr.head.sha, worker_sha:process.env.WORKER_SHA,
              agent_sha:process.env.AGENT_SHA,
              upstream_run_id:Number(process.env.WORKER_CI_RUN),
              tested_steps:requiredWorkerSteps
            }));

  physical:
    name: Governed Dell RAG read-only E2E
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha }}
      WORKER_SHA: cb42568c4b70faa0e3e05bb49d5a6e41b884281f
      AGENT_SHA: 1fc032d4c412bdb4ed202cf1193caf0cb49490ce
      RULES_SHA: 4e6091a133f8d7d157abe6f83c31ca597812e0a4
      NATIVE_OLLAMA_DEV: "1"
      NATIVE_MODEL_DIGEST_PREFIX: dae161e27b0e
      CORRELATION_ID: rag-dell-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Admit exact Dell runner without privilege escalation
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-PDQK954' -or
              $env:RUNNER_NAME -ne 'DESKTOP-PDQK954-runtime') {
            throw 'RAG_WRONG_PHYSICAL_RUNNER'
          }

      - name: Checkout exact runtime PR SHA (not merge-ref)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_RUNTIME_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable Worker Pool RAG source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/engineering-worker-pool
          ref: ${{ env.WORKER_SHA }}
          path: external/engineering-worker-pool
          persist-credentials: false

      - name: Checkout immutable Agent Core source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/agent-core
          ref: ${{ env.AGENT_SHA }}
          path: external/agent-core
          persist-credentials: false

      - name: Checkout canonical rules SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          persist-credentials: false

      - name: Governed Session Launcher and runner version preflight
        id: session
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args = @('--policy',$policy,'--repo',$env:GITHUB_WORKSPACE,
            '--session-prefix','rag-dell-ro',
            '--correlation-id',$env:CORRELATION_ID,
            '--expected-head',$env:EXPECTED_RUNTIME_SHA,
            '--sync-ref','origin/feat/agentic-rag-physical-readonly-20261025',
            '--require-runner-version-preflight')
          $raw = & python -B $launcher @args
          if ($LASTEXITCODE -ne 0) { throw 'RAG_SESSION_LAUNCH_FAILED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or
              $session.state_validated -ne $true -or
              $session.head -ne $env:EXPECTED_RUNTIME_SHA -or
              $session.snapshot_sha256 -notmatch '^[a-f0-9]{64}$' -or
              [string]::IsNullOrWhiteSpace($session.session_id)) {
            throw 'RAG_SESSION_LAUNCH_BLOCKED'
          }
          "target=$($session.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session=$($session.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "snapshot=$($session.snapshot_sha256)" | Add-Content $env:GITHUB_OUTPUT
          Write-Output 'RAG_SESSION_LAUNCH_OK'

      - name: Install minimal pinned dependency inside isolated venv via Gateway
        shell: powershell
        env:
          SESSION_TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $venv = Join-Path $env:SESSION_TARGET_PATH '.venv'
          $python = Join-Path $venv 'Scripts\python.exe'
          $base = @('--policy',$policy,'--correlation-id',$env:CORRELATION_ID,
            'run','--cwd',$env:SESSION_TARGET_PATH,
            '--session-id',$env:SESSION_ID,'--risk','2',
            '--timeout','180','--expected-head',$env:EXPECTED_RUNTIME_SHA,'--')
          & python $gateway @base 'python' '-m' 'venv' $venv
          if ($LASTEXITCODE -ne 0) { throw 'RAG_VENV_SETUP_BLOCKED' }
          & python $gateway @base $python '-m' 'pip' 'install' '--isolated' '--disable-pip-version-check' '--no-input' '--no-cache-dir' 'httpx==0.28.1'
          if ($LASTEXITCODE -ne 0) { throw 'RAG_DEPENDENCY_SETUP_BLOCKED' }
          & python $gateway @base $python '-m' 'pip' 'check'
          if ($LASTEXITCODE -ne 0) { throw 'RAG_DEPENDENCY_CHECK_BLOCKED' }

      - name: Governed physical RAG and independent source readback
        id: rag
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SESSION_TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          SESSION_SNAPSHOT_SHA256: ${{ steps.session.outputs.snapshot }}
          SESSION_LAUNCH_RESULT: SESSION_LAUNCH_OK
          SESSION_STATE_VALIDATED: "true"
          SESSION_GATEWAY_BOUND: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $script = Join-Path $env:SESSION_TARGET_PATH 'scripts\agentic_rag_physical_readonly.py'
          $python = Join-Path $env:SESSION_TARGET_PATH '.venv\Scripts\python.exe'
          $argv = @('--policy',$policy,'--correlation-id',$env:CORRELATION_ID,
            'run','--cwd',$env:SESSION_TARGET_PATH,
            '--session-id',$env:SESSION_ID,'--risk','1',
            '--timeout','280','--expected-head',$env:EXPECTED_RUNTIME_SHA,
            '--',$python,'-B',$script)
          & python $gateway @argv
          if ($LASTEXITCODE -ne 0) { throw 'RAG_PHYSICAL_GATEWAY_EXECUTION_BLOCKED' }

  physical_runner_watchdog:
    name: Physical RAG runner pickup watchdog 300s
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    steps:
      - name: Verify pickup or cancel stale run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const started = Date.now(), limitMs = 300000;
            const expected = 'Governed Dell RAG read-only E2E';
            while (Date.now() - started < limitMs) {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner:context.repo.owner, repo:context.repo.repo,
                run_id:context.runId, per_page:100
              });
              const job = data.jobs.find(j => j.name === expected);
              if (job && job.status === 'completed') {
                if (job.runner_name === 'DESKTOP-PDQK954-runtime' &&
                    Number(job.runner_id) > 0) {
                  core.info('RAG_PHYSICAL_PICKUP_OBSERVED_COMPLETED'); return;
                }
                core.setFailed('RAG_PHYSICAL_JOB_COMPLETED_WITHOUT_REAL_RUNNER'); return;
              }
              if (job && job.status === 'in_progress' &&
                  job.runner_name === 'DESKTOP-PDQK954-runtime' &&
                  Number(job.runner_id) > 0) {
                core.info('RAG_PHYSICAL_PICKUP_OBSERVED_RUNNING'); return;
              }
              await new Promise(resolve => setTimeout(resolve,15000));
            }
            core.setFailed('RAG_PHYSICAL_RUNNER_NO_PICKUP_300S');
            await github.rest.actions.cancelWorkflowRun({
              owner:context.repo.owner, repo:context.repo.repo,
              run_id:context.runId
            });

  independent_readback:
    name: Independent Dell job and GitHub source readback
    needs: [admission, physical]
    if: needs.admission.result == 'success' && needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Verify executed Dell Gateway step, host and immutable source
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner:context.repo.owner, repo:context.repo.repo,
              run_id:context.runId, per_page:100
            });
            const job = data.jobs.find(j => j.name === 'Governed Dell RAG read-only E2E');
            const required = [
              'Admit exact Dell runner without privilege escalation',
              'Governed Session Launcher and runner version preflight',
              'Install minimal pinned dependency inside isolated venv via Gateway',
              'Governed physical RAG and independent source readback'
            ];
            if (!job || job.status !== 'completed' || job.conclusion !== 'success' ||
                job.runner_name !== 'DESKTOP-PDQK954-runtime' ||
                Number(job.runner_id) <= 0 ||
                job.head_sha !== context.payload.pull_request.head.sha ||
                !required.every(name => job.steps?.some(s =>
                  s.name === name && s.status === 'completed' &&
                  s.conclusion === 'success'))) {
              core.setFailed('RAG_PHYSICAL_JOB_OR_GATEWAY_NOT_VERIFIED'); return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner:'ericson-j-santos', repo:'agent-core', pull_number:9
            });
            const expectedHead = 'b083a23af7c55f96ee1c7f8daabbd51167bf4de6';
            if (pr.head.sha !== expectedHead ||
                pr.head.repo?.full_name !== 'ericson-j-santos/agent-core') {
              core.setFailed('RAG_SOURCE_PR_INDEPENDENT_DRIFT'); return;
            }
            const { data: file } = await github.rest.repos.getContent({
              owner:'ericson-j-santos', repo:'agent-core',
              path:'docs/PR_CONTEXT_RETRIEVAL.md', ref:expectedHead
            });
            const crypto = require('crypto');
            const raw = Buffer.from(file.content.replace(/\n/g,''),'base64');
            const digest = crypto.createHash('sha256').update(raw).digest('hex');
            const blob = crypto.createHash('sha1')
              .update(Buffer.concat([Buffer.from('blob ' + raw.length + '\0'),raw]))
              .digest('hex');
            if (digest !== 'b3f7aceab1c5caf0e2aab532189ea4d970aa710120a459f111d7fc9026cfa706' ||
                blob !== file.sha || file.size !== raw.length ||
                !raw.toString('utf8').split(/\r?\n/)[4]?.includes('github.pr.context.v1')) {
              core.setFailed('RAG_SOURCE_DIGEST_INDEPENDENT_DRIFT'); return;
            }
            core.info(JSON.stringify({
              result:'RAG_DELL_PHYSICAL_INDEPENDENT_READBACK_OK',
              runner_id:job.runner_id,runner_name:job.runner_name,
              runtime_sha:job.head_sha,pr_head_sha:expectedHead,
              source_sha256:digest,run_id:context.runId,
              physical_job_id:job.id
            }));
