name: Desktop legacy ReqSys runner metadata read-only
on:
  push:
    branches:
      - fix/pc24x7-supervisor-receipt-readonly-20261012
    paths:
      - .github/workflows/pc24x7-legacy-runner-metadata-readonly.yml

permissions:
  contents: read

concurrency:
  group: legacy-runner-metadata-20261012
  cancel-in-progress: false

jobs:
  contract:
    name: Validate fixed ReqSys runner metadata contract
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run existing contract and negative tests
        shell: powershell
        run: |
          python -m compileall -q scripts tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_reqsys_registered_runner_metadata_preflight.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  inspect:
    needs: contract
    name: Read fixed legacy runner registration without starting it
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 6
    steps:
      - name: Checkout exact runtime SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout canonical operational rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: f6ccb143a581e28650e9b640226f9ef671d469f2
          path: _rules
          persist-credentials: false
      - name: Bootstrap session at exact SHA
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'PINNED_PYTHON_MISSING' }
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args = @('--policy', $policy, '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', 'legacy-runner-inspect',
            '--correlation-id', "legacy-runner-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            '--expected-head', $env:GITHUB_SHA,
            '--sync-ref', 'origin/fix/pc24x7-supervisor-receipt-readonly-20261012',
            '--require-runner-version-preflight')
          $raw = @(& $python $launcher @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'SESSION_LAUNCH_BLOCKED' }
          $s = @($raw)[-1] | ConvertFrom-Json
          if ($s.result -ne 'SESSION_LAUNCH_OK' -or $s.state_validated -ne $true -or
              $s.head -ne $env:GITHUB_SHA -or $s.host -ne 'DESKTOP-PDQK954' -or
              $s.runner_version_preflight.ok -ne $true) { throw 'SESSION_IDENTITY_INVALID' }
          "target_path=$($s.target_path)" | Add-Content -Path $env:GITHUB_OUTPUT
          "session_id=$($s.session_id)" | Add-Content -Path $env:GITHUB_OUTPUT
      - name: Inspect fixed ReqSys runner metadata through Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $evidence = Join-Path $env:TARGET_PATH 'artifacts\legacy-runner\metadata.json'
          $args = @('--policy', $policy, '--correlation-id', "legacy-runner-$env:GITHUB_RUN_ID",
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '1', '--timeout', '40', '--expected-head', $env:GITHUB_SHA,
            '--', 'python', 'scripts/reqsys_registered_runner_metadata_preflight.py',
            '--evidence-file', $evidence)
          $raw = @(& $python $gateway @args)
          $exit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) {
            throw 'LEGACY_RUNNER_EVIDENCE_MISSING'
          }
          $observed = Get-Content -LiteralPath $evidence -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($observed.host -ne 'DESKTOP-PDQK954') { throw 'LEGACY_RUNNER_HOST_MISMATCH' }
          if ($observed.status -eq 'metadata_verified') {
            if ($observed.source_sha -ne $env:GITHUB_SHA -or
                $observed.repository_matches_reqsys -ne $true -or
                $observed.registered_runtime_files_present -ne $true -or $exit -ne 0) {
              throw 'LEGACY_RUNNER_METADATA_CONTRACT_INVALID'
            }
            Write-Host 'LEGACY_RUNNER_METADATA_VERIFIED'
          } else {
            Write-Host 'LEGACY_RUNNER_METADATA_BLOCKED'
            throw 'LEGACY_RUNNER_METADATA_UNAVAILABLE'
          }
      - name: Upload sanitized metadata evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-runner-metadata-readonly
          path: ${{ steps.session.outputs.target_path }}/artifacts/legacy-runner/metadata.json
          if-no-files-found: warn
          retention-days: 7
