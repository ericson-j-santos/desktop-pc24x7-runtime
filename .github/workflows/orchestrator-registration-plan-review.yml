name: Orchestrator supervised activation plan
on:
  push:
    branches: [ops/orchestrator-dev-plan-2232022f-20261028]
    paths: [.github/workflows/orchestrator-registration-plan-review.yml]
permissions:
  contents: read
concurrency:
  group: orchestrator-registration-plan-review-desktop
  cancel-in-progress: false
jobs:
  admit:
    name: Admit approved source and positive physical preflight
    runs-on: windows-latest
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Verify current approved source and terminal independent readback
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            if (context.repo.owner !== 'ericson-j-santos' || context.repo.repo !== 'desktop-pc24x7-runtime' ||
                context.ref !== 'refs/heads/ops/orchestrator-dev-plan-2232022f-20261028' ||
                context.eventName !== 'push' || process.env.GITHUB_RUN_ATTEMPT !== '1' || context.payload.before !== '424136fe25e63f6fe0811828735dc3b3e8f82b20') throw new Error('PLAN_SCOPE_REJECTED');
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:115});
            const {data: main} = await github.rest.repos.getBranch({...context.repo,branch:'main'});
            const {data: rules} = await github.rest.repos.getBranch({owner:'ericson-j-santos',repo:'chatgpt-operational-rules',branch:'main'});
            if (!pr.merged || pr.head.sha !== '674c0d9e89b7b64de643ae1ea1e9761aa482df40' || pr.merge_commit_sha !== 'e0c40bccf0d99858a21beab0d62d0f143e969608' || main.commit.sha !== 'e0c40bccf0d99858a21beab0d62d0f143e969608' ||
                rules.commit.sha !== '682bba2858e09c161e7d3a477896ba7e326e83bd') throw new Error('PLAN_SOURCE_OR_RULES_CHANGED');
            const deadline = Date.now()+180000;
            while (true) {
              const {data} = await github.rest.actions.listWorkflowRunsForRepo({...context.repo,head_sha:main.commit.sha,event:'push',per_page:30});
              const runs = data.workflow_runs.filter(r => r.path === '.github/workflows/ci.yml' && r.head_sha === main.commit.sha);
              if (runs.some(r => r.status === 'completed' && r.conclusion === 'success' && r.run_attempt === 1)) break;
              if (runs.some(r => r.status === 'completed' && r.conclusion !== 'success') || Date.now()>=deadline) throw new Error('SOURCE_CI_NOT_POSITIVE');
              await new Promise(resolve => setTimeout(resolve,15000));
            }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e0c40bccf0d99858a21beab0d62d0f143e969608
          persist-credentials: false
      - name: Test closed supervision deployment contracts
        shell: pwsh
        run: python -B -m unittest discover -s tests -p test_orchestrator_dev_supervision_deploy.py -v
  plan:
    name: Prepare supervision activation plan on Desktop
    needs: admit
    runs-on: ${{ fromJSON('["self-hosted","Windows","X64","pc24x7","desktop-runtime","runtime-dev","desktop-pdqk954"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      receipt: ${{ steps.plan.outputs.receipt }}
    env:
      CORRELATION_ID: orchestrator-plan-review-${{ github.run_id }}-1
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - name: Require exact Desktop runner
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const {data} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId,per_page:100});
            const job = data.jobs.find(j => j.name === 'Prepare supervision activation plan on Desktop');
            if (data.total_count !== data.jobs.length || job?.runner_id !== 2 ||
                process.env.RUNNER_NAME !== 'DESKTOP-PDQK954-runtime' ||
                require('os').hostname().toUpperCase() !== 'DESKTOP-PDQK954' ||
                process.env.GITHUB_RUN_ATTEMPT !== '1') throw new Error('PLAN_RUNNER_REJECTED');
      - name: Checkout exact supervised activation source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: e0c40bccf0d99858a21beab0d62d0f143e969608
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact canonical rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: 682bba2858e09c161e7d3a477896ba7e326e83bd
          path: _rules
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize governed harness and exact approved source sessions
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $raw = & python -B $launcher --policy $policy --repo $env:GITHUB_WORKSPACE --session-prefix supervision-source --correlation-id $env:CORRELATION_ID --expected-head e0c40bccf0d99858a21beab0d62d0f143e969608 --sync-ref origin/main --require-runner-version-preflight
          $exitCode = $LASTEXITCODE
          $raw | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }
          $s = @($raw)[-1] | ConvertFrom-Json
          if ($s.result -ne "SESSION_LAUNCH_OK" -or $s.state_validated -ne $true -or $s.head -ne "e0c40bccf0d99858a21beab0d62d0f143e969608" -or $s.runner_version_preflight.ok -ne $true) { throw "SOURCE_SESSION_BLOCKED" }
          "source_path=$($s.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "source_session_id=$($s.session_id)" | Add-Content $env:GITHUB_OUTPUT
      - name: Prepare fixed activation digest through Gateway
        id: plan
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.source_path }}
          SESSION_ID: ${{ steps.session.outputs.source_session_id }}
          APPROVED_SOURCE_ROOT: ${{ steps.session.outputs.source_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\orchestrator_dev_supervision_deploy.py"
          $raw = & python $gateway --policy $policy --correlation-id $env:CORRELATION_ID run --cwd $env:TARGET_PATH --session-id $env:SESSION_ID --risk 2 --timeout 600 --expected-head "e0c40bccf0d99858a21beab0d62d0f143e969608" -- python -B $script plan --source-sha e0c40bccf0d99858a21beab0d62d0f143e969608 --correlation-id orchestrator-dev-supervision-review
          $exitCode = $LASTEXITCODE
          $raw | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }
          $event = @($raw)[-1] | ConvertFrom-Json
          if ($event.result -ne "ok" -or $event.state_changed -ne $false -or $event.command_exit_code -ne 0) { throw "PLAN_GATEWAY_READBACK_REJECTED" }
          $receipt = $event.stdout | ConvertFrom-Json
          if ($receipt.state -ne "ACTIVATION_PLAN_READY_EXECUTION_PENDING" -or $receipt.configuration_read_only -ne $true -or $receipt.runner_id -ne 21) { throw "PLAN_BLOCKED" }
          "receipt=$($event.stdout.Trim())" | Add-Content $env:GITHUB_OUTPUT
  readback:
    name: Independent supervision plan digest readback
    needs: [admit, plan]
    if: ${{ always() && needs.admit.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      RECEIPT: ${{ needs.plan.outputs.receipt }}
    steps:
      - name: Verify actual physical job and source remain current
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const {data} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId,per_page:100});
            const job = data.jobs.find(j => j.name === 'Prepare supervision activation plan on Desktop');
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:115});
            if (data.total_count !== data.jobs.length || job?.runner_id !== 2 ||
                job.status !== 'completed' || job.conclusion !== 'success' ||
                (!pr.merged || pr.head.sha !== '674c0d9e89b7b64de643ae1ea1e9761aa482df40' || pr.merge_commit_sha !== 'e0c40bccf0d99858a21beab0d62d0f143e969608') ||
                !job.steps.some(s => s.name === 'Prepare fixed activation digest through Gateway' && s.conclusion === 'success')) throw new Error('PLAN_PHYSICAL_READBACK_BLOCKED');
      - name: Validate read-only qualification receipt
        shell: python
        run: |
          import hashlib, json, os
          receipt = json.loads(os.environ["RECEIPT"])
          assert receipt["kind"] == "orchestrator-dev-supervised-activation-plan"
          assert receipt["runner_id"] == 21 and receipt["host"] == "DESKTOP-PDQK954"
          assert receipt["source_sha"] == "e0c40bccf0d99858a21beab0d62d0f143e969608"
          assert receipt["configuration_read_only"] is True
          assert receipt["rdc_recovery_enabled"] is False
          assert receipt["additional_runner_profiles"] == ["orchestrator-dev"]
          assert receipt["task_creation_only_if_absent"] is True
          assert receipt["additional_cost_authorized_brl"] == 0
          assert receipt["host_reboot_planned"] is False
          expected = receipt["plan_sha256"]
          body = {k:v for k,v in receipt.items() if k not in {"plan_sha256","state","configuration_read_only","temporary_package_verification"}}
          actual = hashlib.sha256(json.dumps(body,sort_keys=True,separators=(",",":"),ensure_ascii=True).encode()).hexdigest()
          assert actual == expected
          print("SUPERVISION_PLAN_INDEPENDENT_READBACK_OK:" + json.dumps(receipt,sort_keys=True))
  queue_watchdog:
    name: Registration plan pickup watchdog
    needs: admit
    runs-on: windows-latest
    timeout-minutes: 7
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const deadline = Date.now() + 300000;
            while (true) {
              const {data} = await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:context.runId,per_page:100});
              const job = data.jobs.find(j => j.name === 'Prepare supervision activation plan on Desktop');
              if (data.total_count !== data.jobs.length) throw new Error('PLAN_JOB_LIST_INCOMPLETE');
              if (job?.runner_id === 2 && ['in_progress','completed'].includes(job.status)) return;
              if (Date.now() >= deadline) {
                await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:context.runId});
                throw new Error('PLAN_PICKUP_EXPIRED');
              }
              await new Promise(resolve => setTimeout(resolve,15000));
            }
