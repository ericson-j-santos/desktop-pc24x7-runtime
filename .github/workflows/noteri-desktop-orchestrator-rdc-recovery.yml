name: Noteri Desktop RDC Recovery via Orchestrator

on:
  push:
    branches:
      - "fix/noteri-orchestrator-rdc-recovery-*"
    paths:
      - "scripts/noteri_desktop_orchestrator_rdc_recovery.py"
      - "tests/test_noteri_desktop_orchestrator_rdc_recovery.py"
      - ".github/workflows/noteri-desktop-orchestrator-rdc-recovery.yml"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-orchestrator-rdc-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate RDC recovery contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Compile recovery client
        run: python -m py_compile scripts/noteri_desktop_orchestrator_rdc_recovery.py

      - name: Run positive and negative controls
        run: python -m pytest tests/test_noteri_desktop_orchestrator_rdc_recovery.py -q

  recover:
    name: Recover Desktop RDC through Orchestrator from Noteri
    needs: contract
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 2e8aa9912dd453b9f1d7bc4bdee588a40a85e729
      CORRELATION_ID: desktop-rdc-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: ${{ runner.temp }}\desktop-rdc-orchestrator\evidence.json
    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve evidence path
        shell: powershell
        run: |
          "EVIDENCE_FILE=$env:RUNNER_TEMP\\desktop-rdc-orchestrator\\evidence.json" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-rdc-recovery",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Recover fixed Desktop RDC through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_rdc_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "120",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "RECOVER-DESKTOP-RDC-VIA-ORCHESTRATOR",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_FILE,
            "--timeout-seconds", "90"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized recovery evidence
        shell: powershell
        run: |
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw "desktop_rdc_recovery_failed" }
          if (-not $e.rdc_task_started) { throw "rdc_task_not_started" }
          if (-not $e.replayed) { throw "idempotency_not_proven" }
          if ($e.production_touched) { throw "production_touched" }
          if ($e.secrets_read) { throw "secrets_read" }
          if ($e.remote_shell_used) { throw "remote_shell_used" }

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-rdc-orchestrator-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30
