name: Lenovo Git discovery DEV (read-only)
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact certified main SHA
        required: true
        type: string
      confirmation:
        description: Read-only discovery
        required: true
        type: choice
        options: [READ_ONLY_LENOVO_GIT_DISCOVERY]
permissions:
  contents: read
  actions: read
concurrency:
  group: lenovo-git-discovery-readonly-dev
  cancel-in-progress: false
jobs:
  discover:
    if: github.actor == 'ericson-j-santos' && github.triggering_actor == 'ericson-j-santos' && github.ref == 'refs/heads/main' && vars.REQSYS_PC24X7_COST_ZERO_CERTIFIED_SHA == github.sha
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-rp23ogs]
    environment: DEV
    timeout-minutes: 4
    steps:
      - name: Admit owner, exact main, SHA and CI
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            const repo='ericson-j-santos/desktop-pc24x7-runtime';
            const sha=process.env.EXPECTED_SOURCE_SHA || '';
            if(context.eventName!=='workflow_dispatch' ||
               context.actor!=='ericson-j-santos' ||
               context.repo.owner+'/'+context.repo.repo!==repo ||
               context.ref!=='refs/heads/main' ||
               process.env.GITHUB_RUN_ATTEMPT!=='1' ||
               process.env.CONFIRMATION!=='READ_ONLY_LENOVO_GIT_DISCOVERY' ||
               !/^[a-f0-9]{40}$/.test(sha) || context.sha!==sha)
              throw Error('LENOVO_GIT_DISCOVERY_ADMISSION_REJECTED');
            const {data:main}=await github.rest.repos.getBranch({...context.repo,branch:'main'});
            if(main.commit.sha!==sha) throw Error('LENOVO_GIT_DISCOVERY_MAIN_MOVED');
            const {data:runs}=await github.rest.actions.listWorkflowRuns({
              ...context.repo,workflow_id:'ci.yml',head_sha:sha,
              branch:'main',event:'push',status:'completed',per_page:100
            });
            const passed=runs.workflow_runs.filter(x=>x.head_sha===sha &&
              x.head_branch==='main' && x.event==='push' &&
              x.conclusion==='success' && x.repository?.full_name===repo);
            if(passed.length!==1) throw Error('LENOVO_GIT_DISCOVERY_CI_REQUIRED');
            const {data:jobs}=await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo,run_id:passed[0].id,filter:'latest',per_page:100
            });
            if(jobs.total_count!==jobs.jobs.length) throw Error('LENOVO_GIT_DISCOVERY_CI_INCOMPLETE');
            for(const [name,label] of [['Python compile and tests','windows-latest'],
                                       ['Portable Linux compile and tests','ubuntu-latest']]){
              const found=jobs.jobs.filter(j=>j.name===name);
              if(found.length!==1 || found[0].conclusion!=='success' ||
                 !found[0].labels?.includes(label) ||
                 !found[0].steps?.some(s=>s.name==='Unit and negative-control tests' &&
                   s.conclusion==='success'))
                throw Error('LENOVO_GIT_DISCOVERY_CI_GATES_REQUIRED');
            }
            // Bootstrap dependency inspection only. Not a session or Command Gateway approval.
            if (process.env.COMPUTERNAME!=='DESKTOP-RP23OGS' ||
                process.env.RUNNER_NAME!=='DESKTOP-RP23OGS-runtime')
              throw Error('LENOVO_BOOTSTRAP_HOST_REJECTED');
            const fs=require('node:fs'), path=require('node:path');
            function stateOf(candidate) {
              try {
                const item=fs.lstatSync(candidate);
                return item.isSymbolicLink()?'link_rejected':
                  item.isFile()?'file_present_unverified':'not_file';
              } catch(e) {
                return e.code==='ENOENT'?'missing':'unreadable';
              }
            }
            const candidates=[];
            for (const [label,variable,tail] of [
              ['system','ProgramFiles',['Git','cmd','git.exe']],
              ['system64','ProgramW6432',['Git','cmd','git.exe']],
              ['system32','ProgramFiles(x86)',['Git','cmd','git.exe']],
              ['user','LOCALAPPDATA',['Programs','Git','cmd','git.exe']],
              ['mingit','ProgramData',['ReqSys','MinGit','cmd','git.exe']],
              ['portable','LOCALAPPDATA',['Programs','Git','bin','git.exe']],
              ['vscode','LOCALAPPDATA',['Programs','Microsoft VS Code',
                'resources','app','extensions','git','bin','git.exe']]
            ]) {
              const root=process.env[variable];
              candidates.push({candidate:label,state:!root||!path.isAbsolute(root)
                ?'root_unavailable':stateOf(path.join(root,...tail))});
            }
            const local=process.env.LOCALAPPDATA;
            if(local&&path.isAbsolute(local)) {
              const desktop=path.join(local,'GitHubDesktop');
              try {
                const info=fs.lstatSync(desktop);
                if(info.isDirectory()&&!info.isSymbolicLink()) {
                  const versions=fs.readdirSync(desktop,{withFileTypes:true})
                    .filter(v=>/^app-[0-9]/.test(v.name)&&v.isDirectory())
                    .map(v=>v.name).sort().slice(0,12);
                  for(const [index,version] of versions.entries()) {
                    for(const [kind,tail] of [
                      ['cmd',['resources','app','git','cmd','git.exe']],
                      ['mingw64',['resources','app','git','mingw64','bin','git.exe']]
                    ]) candidates.push({candidate:'desktop_'+index+'_'+kind,
                      state:stateOf(path.join(desktop,version,...tail))});
                  }
                }
              } catch(e) {
                if(e.code!=='ENOENT') candidates.push({candidate:'github_desktop',state:'unreadable'});
              }
            }
            core.info('LENOVO_BOOTSTRAP_DEPENDENCY_CHECK '+JSON.stringify({
              contract:'lenovo-git-bootstrap-dependency-v1',host_verified:true,
              runner_verified:true,candidates,git_verified:false,
              session_launch_ok:false,state_validated:false,
              execution_authorized:false,mutation_performed:false
            }));
