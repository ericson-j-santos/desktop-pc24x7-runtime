name: Issue 8 Qwen7B fenced Git bundle and hosted CAS DEV

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: issue8-qwen7b-fenced-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Issue8 bundle transport contract
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue8-fenced-qwen-bundle-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed SHA without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate model bundle and hosted validator contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m compileall -q scripts/issue8_qwen7b_fenced_bundle_stage.py scripts/issue8_qwen7b_independent_bundle_validator.py tests/test_issue8_qwen7b_fenced_bundle_stage.py tests/test_issue8_qwen7b_independent_bundle_validator.py
          python -m pytest -q tests/test_issue8_qwen7b_fenced_bundle_stage.py tests/test_issue8_qwen7b_independent_bundle_validator.py

  admission:
    name: Owner issue and SHA admission (no writes)
    needs: contract
    if: >-
      needs.contract.result == 'success' &&
      github.event.action == 'edited' &&
      github.actor == 'ericson-j-santos' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/issue8-fenced-qwen-bundle-20261025' &&
      github.event.pull_request.draft == true &&
      contains(github.event.pull_request.body, 'OWNER_ISSUE8_FENCED_BUNDLE_20261025_ONCE') &&
      github.event.changes.body.from != null &&
      !contains(github.event.changes.body.from, 'OWNER_ISSUE8_FENCED_BUNDLE_20261025_ONCE')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Observe exact owner, Worker Pool source and executed CI
        uses: actions/github-script@v7
        with:
          script: |
            const owner='ericson-j-santos',worker='engineering-worker-pool';
            const source='21fd68dec6f0da92b3e7da201463401ac5429d64';
            const runtime='a0437b0deb7db42fb91866fe8e77359844579cf6';
            const sha=context.payload.pull_request.head.sha;
            const pr=(await github.rest.pulls.get({
              owner,repo:context.repo.repo,pull_number:context.payload.pull_request.number
            })).data;
            const runtimeMain=(await github.rest.repos.getBranch({
              owner,repo:context.repo.repo,branch:'main'
            })).data;
            const workerMain=(await github.rest.repos.getBranch({
              owner,repo:worker,branch:'main'
            })).data;
            if (!pr.draft || pr.state!=='open' || pr.head.sha!==sha ||
                pr.head.ref!=='feat/issue8-fenced-qwen-bundle-20261025' ||
                pr.head.repo?.full_name!==owner+'/'+context.repo.repo ||
                !pr.body?.includes('OWNER_ISSUE8_FENCED_BUNDLE_20261025_ONCE') ||
                pr.base.sha!==runtime || runtimeMain.commit.sha!==runtime ||
                workerMain.commit.sha!==source) {
              core.setFailed('ISSUE8_NATIVE_BASE_OR_PR_DRIFT');return;
            }
            const [issue,comment,sourceFile,workerChecks,runtimeChecks]=await Promise.all([
              github.rest.issues.get({owner,repo:worker,issue_number:8}),
              github.rest.issues.getComment({owner,repo:worker,comment_id:6399359287}),
              github.rest.repos.getContent({owner,repo:worker,path:'app/portfolio_bridge.py',ref:source}),
              github.rest.checks.listForRef({owner,repo:worker,ref:source,per_page:100}),
              github.rest.checks.listForRef({owner,repo:context.repo.repo,ref:sha,per_page:100}),
            ]);
            if (issue.data.state!=='open' || !!issue.data.pull_request ||
                comment.data.user?.login!==owner || comment.data.author_association!=='OWNER' ||
                comment.data.body!=='/local-agent authorize bridge.property.v1 sha:'+source ||
                comment.data.issue_url!=='https://api.github.com/repos/'+owner+'/'+worker+'/issues/8' ||
                sourceFile.data.type!=='file' ||
                sourceFile.data.sha!=='d9a25c574163c49f695e774609949160d94f4490') {
              core.setFailed('ISSUE8_OWNER_OR_SOURCE_UNVERIFIED');return;
            }
            const passed=(records,name,ref)=>records.data.check_runs.some(c=>
              c.name===name && c.head_sha===ref && c.status==='completed' &&
              c.conclusion==='success' && c.started_at && c.completed_at);
            if (!passed(workerChecks,'test',source) ||
                !['Python compile and tests','Portable Linux compile and tests'].every(
                  name=>passed(runtimeChecks,name,sha))) {
              core.setFailed('ISSUE8_REQUIRED_CI_NOT_EXECUTED');return;
            }
            core.info('ISSUE8_NATIVE_SHA_ADMITTED source='+source+' runtime='+sha);

  physical:
    name: Dell Qwen7B issue8 fenced Builder and independent checkout
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 11
    permissions:
      contents: read
    outputs:
      bundle_b64: ${{ steps.model.outputs.bundle_b64 }}
      receipt_b64: ${{ steps.model.outputs.receipt_b64 }}
    env:
      EXPECTED_WORKER_SHA: 21fd68dec6f0da92b3e7da201463401ac5429d64
      RULES_SHA: 4e6091a133f8d7d157abe6f83c31ca597812e0a4
      NATIVE_OLLAMA_DEV: "1"
      NATIVE_MODEL_DIGEST_PREFIX: dae161e27b0e
      EXPECTED_RUNTIME_SHA: ${{ github.event.pull_request.head.sha }}
      CORRELATION_ID: qwen8-fenced-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify exact Dell Windows host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne 'DESKTOP-PDQK954' -or $env:RUNNER_NAME -ne 'DESKTOP-PDQK954-runtime') { throw 'ISSUE8_WRONG_HOST' }
      - name: Checkout exact runtime revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.EXPECTED_RUNTIME_SHA }}
          persist-credentials: false
      - name: Checkout exact Worker Pool revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/engineering-worker-pool
          ref: ${{ env.EXPECTED_WORKER_SHA }}
          path: external/engineering-worker-pool
          persist-credentials: false
      - name: Checkout canonical operational rules SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          persist-credentials: false
      - name: Session Launcher preflight and isolated worktree
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args = @('--policy',$policy,'--repo',$env:GITHUB_WORKSPACE,
            '--session-prefix','issue8-qwen-fenced',
            '--correlation-id',$env:CORRELATION_ID,
            '--expected-head',$env:EXPECTED_RUNTIME_SHA,
            '--sync-ref','origin/feat/issue8-fenced-qwen-bundle-20261025',
            '--require-runner-version-preflight')
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = @($raw)[-1] | ConvertFrom-Json
          if ($receipt.result -ne 'SESSION_LAUNCH_OK' -or
              $receipt.state_validated -ne $true -or
              $receipt.head -ne $env:EXPECTED_RUNTIME_SHA) {
            throw 'ISSUE8_SESSION_NOT_ATTESTED'
          }
          "target=$($receipt.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session=$($receipt.session_id)" | Add-Content $env:GITHUB_OUTPUT
      - name: Native Python venv through governed Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
        run: |
          $ErrorActionPreference='Stop'
          $gw=Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy=Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $venv=Join-Path $env:TARGET_PATH '.venv'
          $native=Join-Path $venv 'Scripts\python.exe'
          $req=Join-Path $env:GITHUB_WORKSPACE 'external\engineering-worker-pool\requirements.txt'
          $args=@('--policy',$policy,'--correlation-id',$env:CORRELATION_ID,
            'run','--cwd',$env:TARGET_PATH,'--session-id',$env:SESSION_ID,
            '--risk','2','--timeout','180',
            '--expected-head',$env:EXPECTED_RUNTIME_SHA,'--')
          & python $gw @args 'python' '-m' 'venv' $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & python $gw @args $native '-m' 'pip' 'install' '--isolated' '--disable-pip-version-check' '--no-input' '--no-cache-dir' '-r' $req
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qwen real repair and bounded Git bundle stage through Gateway
        id: model
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_ID: ${{ steps.session.outputs.session }}
          SESSION_TARGET_PATH: ${{ steps.session.outputs.target }}
          SESSION_LAUNCH_RESULT: SESSION_LAUNCH_OK
          SESSION_STATE_VALIDATED: "true"
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          $ErrorActionPreference='Stop'
          $gw=Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy=Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $native=Join-Path $env:TARGET_PATH '.venv\Scripts\python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\issue8_qwen7b_fenced_bundle_stage.py'
          $args=@('--policy',$policy,'--correlation-id',$env:CORRELATION_ID,
            'run','--cwd',$env:TARGET_PATH,'--session-id',$env:SESSION_ID,
            '--risk','2','--timeout','300',
            '--expected-head',$env:EXPECTED_RUNTIME_SHA,
            '--',$native,'-B',$script)
          & python $gw @args
          exit $LASTEXITCODE

  publish-cas:
    name: Publish one real model Git bundle in runtime CAS
    needs: physical
    if: needs.physical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
      pull-requests: read
    outputs:
      bundle_sha256: ${{ steps.publish.outputs.bundle_sha256 }}
      cas_branch_sha: ${{ steps.publish.outputs.cas_branch_sha }}
      produced_sha: ${{ steps.publish.outputs.produced_sha }}
    steps:
      - name: Verify bounded model receipt and publish SHA-addressed bytes
        uses: actions/github-script@v7
        id: publish
        env:
          BUNDLE_B64: ${{ needs.physical.outputs.bundle_b64 }}
          RECEIPT_B64: ${{ needs.physical.outputs.receipt_b64 }}
        with:
          script: |
            const {createHash}=require('crypto');
            const owner='ericson-j-santos',repo='desktop-pc24x7-runtime';
            const base='a0437b0deb7db42fb91866fe8e77359844579cf6';
            const worker='21fd68dec6f0da92b3e7da201463401ac5429d64';
            const branch='agent/issue8-qwen-bundle-'+worker.slice(0,12);
            const raw64=String(process.env.BUNDLE_B64||'');
            const receipt64=String(process.env.RECEIPT_B64||'');
            if (!raw64 || raw64.length>131072 || !receipt64 || receipt64.length>8192 ||
                !/^[A-Za-z0-9+/]*={0,2}$/.test(raw64) ||
                !/^[A-Za-z0-9+/]*={0,2}$/.test(receipt64)) {
              core.setFailed('ISSUE8_BUNDLE_OUTPUT_MISSING');return;
            }
            const blob=Buffer.from(raw64,'base64');
            let r;
            try {r=JSON.parse(Buffer.from(receipt64,'base64').toString('utf8'));}
            catch(e) {core.setFailed('ISSUE8_RECEIPT_JSON_INVALID');return;}
            const digest=createHash('sha256').update(blob).digest('hex');
            if (blob.length<=200 || blob.length>96000 ||
                blob.toString('base64')!==raw64 ||
                r.result!=='ISSUE8_BUNDLE_STAGED_UNPUBLISHED' ||
                r.base_sha!==worker || r.source_repository!=='ericson-j-santos/engineering-worker-pool' ||
                r.issue!==8 || r.owner_comment_id!==6399359287 ||
                !/^[0-9a-f]{40}$/.test(r.produced_sha||'') ||
                r.produced_sha===worker ||
                r.model!=='qwen2.5-coder:7b' ||
                !/^dae161e27b0e[0-9a-f]{52}$/.test(r.model_digest||'') ||
                ![1,2].includes(r.model_calls) || r.replay_model_calls!==0 ||
                r.accepted_cases!==42 || r.regressions_passed<52 ||
                r.independent_checkout!==true || r.fencing_required!==true ||
                r.local_authority_only!==true || r.cas_persisted!==false ||
                r.pr_created!==false || r.bundle_sha256!==digest) {
              core.setFailed('ISSUE8_BUNDLE_ATTESTATION_MISSING');return;
            }
            const pr=(await github.rest.pulls.get({
              owner,repo,pull_number:context.payload.pull_request.number
            })).data;
            const main=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data;
            if (pr.state!=='open' || !pr.draft ||
                pr.head.sha!==context.payload.pull_request.head.sha ||
                pr.head.ref!=='feat/issue8-fenced-qwen-bundle-20261025' ||
                pr.head.repo?.full_name!==owner+'/'+repo ||
                pr.base.sha!==base || main.commit.sha!==base ||
                !pr.body?.includes('OWNER_ISSUE8_FENCED_BUNDLE_20261025_ONCE')) {
              core.setFailed('ISSUE8_PUBLISH_PR_OR_MAIN_DRIFT');return;
            }
            const path='evidence/issue8/sha256/'+digest.slice(0,2)+'/'+digest+'.bundle';
            let existing=null;
            try {existing=(await github.rest.repos.getBranch({owner,repo,branch})).data;}
            catch(e) {if(e.status!==404){core.setFailed('ISSUE8_BRANCH_READ_UNVERIFIED');return;}}
            if (!existing) {
              try {await github.rest.git.createRef({
                owner,repo,ref:'refs/heads/'+branch,sha:base
              });}
              catch(e) {core.setFailed('ISSUE8_BRANCH_CREATE_UNVERIFIED');return;}
              existing=(await github.rest.repos.getBranch({owner,repo,branch})).data;
            }
            let file=null;
            try {file=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;}
            catch(e){if(e.status!==404){core.setFailed('ISSUE8_CAS_READ_UNVERIFIED');return;}}
            if (!file) {
              if (existing.commit.sha!==base) {
                core.setFailed('ISSUE8_CAS_BRANCH_DIVERGENT');return;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,repo,branch,path,content:raw64,
                  message:'evidence: persist Qwen issue-8 SHA-bound Git bundle'
                });
              }catch(e){core.setFailed('ISSUE8_CAS_WRITE_UNVERIFIED');return;}
            }
            const read=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;
            const decoded=Buffer.from((read.content||'').replace(/\s+/g,''),'base64');
            const gitBlob=createHash('sha1').update(
              Buffer.concat([Buffer.from('blob '+decoded.length+'\0'),decoded])
            ).digest('hex');
            const head=(await github.rest.repos.getBranch({owner,repo,branch})).data.commit.sha;
            const diff=(await github.rest.repos.compareCommitsWithBasehead({
              owner,repo,basehead:base+'...'+head
            })).data;
            if (read.type!=='file' || read.path!==path ||
                read.size!==blob.length || read.sha!==gitBlob ||
                !decoded.equals(blob) || diff.status!=='ahead' ||
                diff.ahead_by!==1 || diff.behind_by!==0 ||
                diff.total_commits!==1 || diff.files?.length!==1 ||
                diff.files[0].filename!==path || diff.files[0].status!=='added') {
              core.setFailed('ISSUE8_CAS_INDEPENDENT_READBACK_MISSING');return;
            }
            core.setOutput('bundle_sha256',digest);
            core.setOutput('cas_branch_sha',head);
            core.setOutput('produced_sha',r.produced_sha);
            core.info('ISSUE8_REAL_QWEN_BUNDLE_CAS_CONFIRMED sha='+head+
                      ' digest='+digest+' produced='+r.produced_sha);

  validator:
    name: Independent hosted Validator reads durable CAS and executes real tests
    needs: [physical, publish-cas]
    if: needs.publish-cas.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    env:
      CWP_RECEIPT_B64: ${{ needs.physical.outputs.receipt_b64 }}
      EXPECTED_BUNDLE_SHA256: ${{ needs.publish-cas.outputs.bundle_sha256 }}
      EXPECTED_PRODUCED_SHA: ${{ needs.publish-cas.outputs.produced_sha }}
      CWP_WORKER_SOURCE: ${{ github.workspace }}/external/engineering-worker-pool
      CWP_BUNDLE_FILE: ${{ runner.temp }}/qwen8-verified.bundle
    steps:
      - name: Checkout reviewed runtime script without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout source at authorized Worker Pool SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/engineering-worker-pool
          ref: 21fd68dec6f0da92b3e7da201463401ac5429d64
          path: external/engineering-worker-pool
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Read immutable bundle from canonical GitHub CAS branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),{createHash}=require('crypto');
            const owner='ericson-j-santos',repo='desktop-pc24x7-runtime';
            const base='a0437b0deb7db42fb91866fe8e77359844579cf6';
            const branch='agent/issue8-qwen-bundle-21fd68dec6f0';
            const expected=String(process.env.EXPECTED_BUNDLE_SHA256||'');
            if (!/^[0-9a-f]{64}$/.test(expected)) {
              core.setFailed('ISSUE8_VALIDATOR_DIGEST_MISSING');return;
            }
            const path='evidence/issue8/sha256/'+expected.slice(0,2)+'/'+expected+'.bundle';
            const data=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;
            const raw=Buffer.from((data.content||'').replace(/\s+/g,''),'base64');
            const hash=createHash('sha256').update(raw).digest('hex');
            const blob=createHash('sha1').update(
              Buffer.concat([Buffer.from('blob '+raw.length+'\0'),raw])
            ).digest('hex');
            const b=(await github.rest.repos.getBranch({owner,repo,branch})).data;
            const diff=(await github.rest.repos.compareCommitsWithBasehead({
              owner,repo,basehead:base+'...'+b.commit.sha
            })).data;
            if (data.type!=='file' || data.path!==path ||
                raw.length<=200 || raw.length>96000 || data.sha!==blob ||
                hash!==expected || diff.status!=='ahead' ||
                diff.ahead_by!==1 || diff.behind_by!==0 ||
                diff.total_commits!==1 || diff.files?.length!==1 ||
                diff.files[0].filename!==path) {
              core.setFailed('ISSUE8_VALIDATOR_CAS_READBACK_INVALID');return;
            }
            fs.writeFileSync(process.env.CWP_BUNDLE_FILE,raw,{flag:'wx',mode:0o600});
            core.info('ISSUE8_VALIDATOR_CAS_FILE_PROVED sha='+b.commit.sha+
                      ' sha256='+expected);
      - name: Install existing Worker Pool test dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r external/engineering-worker-pool/requirements.txt
      - name: Verify original Qwen Git commit and tests from independent checkout
        shell: bash
        run: python scripts/issue8_qwen7b_independent_bundle_validator.py

  physical-watchdog:
    name: Physical Dell pickup and 300s material-progress watchdog
    needs: admission
    if: needs.admission.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    steps:
      - name: Fail closed on absent pickup or stalled real Builder stage
        uses: actions/github-script@v7
        with:
          script: |
            const target='Dell Qwen7B issue8 fenced Builder and independent checkout';
            const runId=context.runId;
            let lastCount=-1,lastProgress=Date.now();
            while (Date.now()-lastProgress<300000) {
              const data=(await github.rest.actions.listJobsForWorkflowRun({
                owner:context.repo.owner,repo:context.repo.repo,
                run_id:runId,per_page:100
              })).data;
              const job=data.jobs.find(x=>x.name===target);
              if (job && job.status==='completed') {
                if (job.conclusion!=='success') core.setFailed('ISSUE8_PHYSICAL_FAILED');
                return;
              }
              const progress=(job?.steps||[]).filter(s=>
                s.status==='completed' && s.conclusion!=='skipped').length;
              if (progress>lastCount && job?.runner_name==='DESKTOP-PDQK954-runtime'
                  && Number(job.runner_id)>0) {
                lastCount=progress;lastProgress=Date.now();
              }
              await new Promise(resolve=>setTimeout(resolve,15000));
            }
            core.setFailed('ISSUE8_PHYSICAL_NO_MATERIAL_PROGRESS_300S');
            await github.rest.actions.cancelWorkflowRun({
              owner:context.repo.owner,repo:context.repo.repo,run_id:runId
            });
