name: TODO PG18 hosted encrypted backup (Desktop independent)

on:
  pull_request:
    paths:
      - scripts/todo_hosted_backup.py
      - scripts/pc24x7_todo_recovery.py
      - scripts/pc24x7_todo_sealed.py
      - docs/todo-hosted-backup.md
      - docs/todo-without-neon.md
      - tests/test_todo_neon_retired.py
      - tests/test_todo_hosted_backup.py
      - .github/workflows/todo-hosted-backup.yml
  push:
    branches: [feat/todo-free-recovery-20261016]
    paths:
      - scripts/todo_hosted_backup.py
      - scripts/pc24x7_todo_recovery.py
      - scripts/pc24x7_todo_sealed.py
      - docs/todo-hosted-backup.md
      - docs/todo-without-neon.md
      - tests/test_todo_neon_retired.py
      - tests/test_todo_hosted_backup.py
      - .github/workflows/todo-hosted-backup.yml
  # Source retired by owner on 2026-10-19: no schedule or manual capture trigger.

permissions:
  contents: read

concurrency:
  group: todo-hosted-pg18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic_checks:
    name: Validate hosted runner backup safety offline
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install exact tested dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2
      - name: Verify Python and hosted backup guardrails
        run: |
          python -m py_compile scripts/todo_hosted_backup.py tests/test_todo_hosted_backup.py
          PYTHONPATH=scripts python -m pytest -v -ra tests/test_todo_hosted_backup.py tests/test_todo_neon_retired.py

  backup:
    name: Capture, encrypt and verify offsite draft backup
    # NEON_RETIRED_20261019: historical job only; must never allocate a runner or secrets.
    # Both trigger removal and literal false are intentional, independently tested controls.
    if: ${{ false && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: todo-pg-backup
    permissions:
      contents: write
    container:
      image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TODO_BACKUP_PG_PASSWORD: ${{ secrets.TODO_BACKUP_PG_PASSWORD }}
      TODO_BACKUP_RECIPIENT_PEM_B64: ${{ secrets.TODO_BACKUP_RECIPIENT_PEM_B64 }}
      TODO_BACKUP_RECIPIENT_SHA256: ${{ vars.TODO_BACKUP_RECIPIENT_SHA256 }}
      TODO_BACKUP_CUSTODY_APPROVAL: ${{ vars.TODO_BACKUP_CUSTODY_APPROVAL }}
      PYTHONPATH: scripts
    steps:
      - name: Checkout main without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python for ephemeral PostgreSQL 18 backup worker
        timeout-minutes: 2
        run: |
          apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          apt-get -o Acquire::Retries=0 install -y --no-install-recommends python3 python3-cryptography ca-certificates
          python3 --version
          /usr/lib/postgresql/18/bin/pg_dump --version
      - name: Capture data, seal, upload to private draft release and read back
        timeout-minutes: 7
        run: python3 scripts/todo_hosted_backup.py --bin-dir /usr/lib/postgresql/18/bin
      # No actions/upload-artifact and no cache: no plaintext, private key, or archive in Actions storage.
