name: Desktop Admin Broker Readback Probe

on:
  push:
    branches:
      - "fix/admin-broker-readback-probe-*"
    paths:
      - "scripts/desktop_admin_broker_readback.py"
      - "scripts/desktop_admin_broker_readback_probe.py"
      - "tests/test_desktop_admin_broker_readback.py"
      - "tests/test_desktop_admin_broker_readback_probe.py"
      - ".sdd/specs/desktop-admin-broker-readback-probe.requirements.md"
      - ".github/workflows/desktop-admin-broker-readback-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-admin-broker-readback-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate readback contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Compile targeted scripts
        run: |
          python -m py_compile scripts/desktop_admin_broker_readback.py
          python -m py_compile scripts/desktop_admin_broker_readback_probe.py

      - name: Run targeted positive and negative controls
        run: |
          python -m pytest             tests/test_desktop_admin_broker_readback.py             tests/test_desktop_admin_broker_readback_probe.py -q

  live-probe:
    name: Read latest broker diagnostic
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: One bounded wait for the fixed broker poll interval
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import time
          target = datetime(2026, 10, 11, 12, 24, 30, tzinfo=timezone.utc)
          wait = max(0.0, (target - datetime.now(timezone.utc)).total_seconds())
          if wait > 600:
              raise SystemExit("broker_diagnostic_wait_outside_budget")
          time.sleep(wait)
          PY

      - name: Probe fixed ntfy readback
        run: |
          python scripts/desktop_admin_broker_readback_probe.py             --evidence-file artifacts/desktop-admin-broker-readback/evidence.json             --max-age-seconds 900             --timeout-seconds 10
      - name: Correlate owner refresh request and validated target SHA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          data = json.loads(Path("artifacts/desktop-admin-broker-readback/evidence.json").read_text(encoding="utf-8"))
          issued = datetime(2026, 10, 11, 12, 17, 14, tzinfo=timezone.utc)
          try:
              generated = datetime.fromisoformat(str(data.get("broker_generated_at") or "").replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit("broker_diagnostic_timestamp_invalid")
          result = data.get("result_summary")
          if not (
              type(data.get("comment_id")) is int
              and data["comment_id"] == 6108930731
              and data.get("host") == "DESKTOP-PDQK954"
              and data.get("action") == "refresh-self"
              and data.get("status") == "completed"
              and data.get("trust") == "diagnostic_only"
              and data.get("authoritative_success") is False
              and data.get("production_touched") is False
              and data.get("secrets_read") is False
              and generated.tzinfo is not None and generated >= issued
              and isinstance(result, dict)
              and result.get("handler") == "refresh-self"
              and result.get("target_source_sha") == "c9a05797e046b11027ad4beb037307665de6ad5e"
              and result.get("refresh_state") == "updated"
              and result.get("new_broker_started") is True
          ):
              raise SystemExit("broker_refresh_readback_blocked")
          print(json.dumps({"correlated_comment_id": 6108930731,
                            "sha_target": "c9a05797e046b11027ad4beb037307665de6ad5e",
                            "outcome": "diagnostic_new_broker_started",
                            "origin_authenticated": False}, sort_keys=True))
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-admin-broker-readback-${{ github.run_id }}
          path: artifacts/desktop-admin-broker-readback/evidence.json
          if-no-files-found: error
          retention-days: 30
