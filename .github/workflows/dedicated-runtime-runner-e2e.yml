name: Dedicated Runtime Runner E2E

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Fixed diagnostic only; never accepts commands or targets
        type: choice
        required: true
        default: runner-identity
        options: [runner-identity, native-postgres-inventory, native-postgres-readback, native-wsl-postgres-qualification, orchestrator-runner-preflight]
      lenovo_control_plane_pickup:
        description: Fixed DESKTOP-RP23OGS control-plane pickup; accepts no commands or targets
        type: boolean
        required: true
        default: false
      orchestrator_source_sha:
        description: Exact reviewed current main or same-repository open PR HEAD; required only for orchestrator preflight
        type: string
        required: false
        default: ''
      inventory_source_sha:
        description: Full reviewed main SHA; required only for native inventory
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ inputs.diagnostic == 'orchestrator-runner-preflight' && 'orchestrator-runner-preflight-desktop' || (inputs.diagnostic == 'native-postgres-inventory' || inputs.diagnostic == 'native-postgres-readback' || inputs.diagnostic == 'native-wsl-postgres-qualification') && format('native-pg-inventory-954-{0}', github.run_id) || format('dedicated-runtime-runner-e2e-{0}', github.ref) }}
  cancel-in-progress: ${{ (inputs.diagnostic != 'native-postgres-inventory' && inputs.diagnostic != 'native-postgres-readback' && inputs.diagnostic != 'native-wsl-postgres-qualification' && inputs.diagnostic != 'orchestrator-runner-preflight') }}

jobs:
  resolve_rules:
    name: Resolve canonical operational rules
    runs-on: windows-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      rules_sha: ${{ steps.rules.outputs.sha }}
      orchestrator_main_sha: ${{ steps.orchestrator_admission.outputs.main_sha }}
      orchestrator_source_pr: ${{ steps.orchestrator_admission.outputs.source_pr }}
      orchestrator_ci_run_id: ${{ steps.orchestrator_admission.outputs.ci_run_id }}
      orchestrator_ci_attempt: ${{ steps.orchestrator_admission.outputs.ci_attempt }}
      inventory_admitted_at: ${{ steps.inventory_admission.outputs.admitted_at }}
    steps:
      - name: Admit orchestrator preflight at current source and successful native CI
        id: orchestrator_admission
        if: inputs.diagnostic == 'orchestrator-runner-preflight'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ORCHESTRATOR_SOURCE_SHA: ${{ inputs.orchestrator_source_sha }}
        with:
          script: |
            const repository = 'ericson-j-santos/desktop-pc24x7-runtime';
            const source = process.env.ORCHESTRATOR_SOURCE_SHA || '';
            const branchName = context.ref.replace(/^refs\/heads\//, '');
            if (context.eventName !== 'workflow_dispatch' || context.actor !== 'ericson-j-santos' ||
                context.repo.owner + '/' + context.repo.repo !== repository ||
                !context.ref.startsWith('refs/heads/') || process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                context.payload.inputs.lenovo_control_plane_pickup === 'true' ||
                !/^[0-9a-f]{40}$/.test(source) || source !== context.sha) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_SCOPE_REJECTED');
            }
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const {data: current} = await github.rest.repos.getBranch({...context.repo, branch: branchName});
            if (current.commit.sha !== source) throw new Error('ORCHESTRATOR_PREFLIGHT_HEAD_MOVED');
            let sourcePr = 0;
            if (branchName !== 'main') {
              const {data: pulls} = await github.rest.pulls.list({
                ...context.repo, state: 'open', base: 'main',
                head: context.repo.owner + ':' + branchName, per_page: 100,
              });
              if (pulls.length !== 1 || pulls[0].head.sha !== source ||
                  pulls[0].head.repo?.full_name !== repository ||
                  pulls[0].base.repo?.full_name !== repository ||
                  pulls[0].base.ref !== 'main' || pulls[0].base.sha !== main.commit.sha) {
                throw new Error('ORCHESTRATOR_PREFLIGHT_CURRENT_PR_REQUIRED');
              }
              sourcePr = pulls[0].number;
              const {data: comparison} = await github.rest.repos.compareCommits({
                ...context.repo, base: main.commit.sha, head: source,
              });
              if (!['ahead', 'identical'].includes(comparison.status) ||
                  comparison.merge_base_commit.sha !== main.commit.sha) {
                throw new Error('ORCHESTRATOR_PREFLIGHT_CURRENT_MAIN_REQUIRED');
              }
            } else if (source !== main.commit.sha) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_MAIN_MOVED');
            }
            const {data: runs} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: source,
              branch: branchName, event: 'push', per_page: 100,
            });
            const eligible = runs.workflow_runs.filter(item =>
              item.head_sha === source && item.head_branch === branchName &&
              item.event === 'push' && item.repository?.full_name === repository);
            if (!eligible.length || eligible.some(item => !Number.isSafeInteger(item.id) || item.id <= 0 ||
                !Number.isSafeInteger(item.run_attempt) || item.run_attempt <= 0 ||
                !Number.isFinite(Date.parse(item.created_at)))) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_CI_METADATA_INVALID');
            }
            eligible.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const run = eligible[0];
            if (run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error('ORCHESTRATOR_PREFLIGHT_LATEST_CI_SUCCESS_REQUIRED');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            if (jobs.total_count !== jobs.jobs.length) throw new Error('ORCHESTRATOR_PREFLIGHT_CI_INCOMPLETE');
            for (const [name, label] of [
              ['Python compile and tests', 'windows-latest'],
              ['Portable Linux compile and tests', 'ubuntu-latest'],
            ]) {
              const matches = jobs.jobs.filter(job => job.name === name);
              const job = matches[0];
              if (matches.length !== 1 || job.run_id !== run.id ||
                  job.status !== 'completed' || job.conclusion !== 'success' ||
                  !job.started_at || !job.completed_at || !job.labels?.includes(label) ||
                  !['Compile', 'Unit and negative-control tests'].every(name =>
                    job.steps?.some(step => step.name === name && step.status === 'completed' &&
                    step.conclusion === 'success'))) {
                throw new Error('ORCHESTRATOR_PREFLIGHT_REAL_CI_REQUIRED');
              }
            }
            core.setOutput('main_sha', main.commit.sha);
            core.setOutput('source_pr', String(sourcePr));
            core.setOutput('ci_run_id', String(run.id));
            core.setOutput('ci_attempt', String(run.run_attempt));

      - name: Admit fixed inventory from reviewed current main and successful native CI
        id: inventory_admission
        if: (inputs.diagnostic == 'native-postgres-inventory' || inputs.diagnostic == 'native-postgres-readback' || inputs.diagnostic == 'native-wsl-postgres-qualification')
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          INVENTORY_SOURCE_SHA: ${{ inputs.inventory_source_sha }}
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' || context.actor !== 'ericson-j-santos' ||
                context.repo.owner !== 'ericson-j-santos' || context.repo.repo !== 'desktop-pc24x7-runtime' ||
                context.ref !== 'refs/heads/main' || process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                !/^[0-9a-f]{40}$/.test(process.env.INVENTORY_SOURCE_SHA || '') ||
                process.env.INVENTORY_SOURCE_SHA !== context.sha) {
              throw new Error('NATIVE_INVENTORY_SCOPE_REJECTED');
            }
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.commit.sha !== context.sha) throw new Error('NATIVE_INVENTORY_MAIN_MOVED');
            const {data: runs} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha,
              branch: 'main', event: 'push', status: 'completed', per_page: 100,
            });
            const run = runs.workflow_runs.find(r => r.head_sha === context.sha &&
              r.head_branch === 'main' && r.event === 'push' && r.conclusion === 'success' &&
              r.repository.full_name === 'ericson-j-santos/desktop-pc24x7-runtime');
            if (!run) throw new Error('NATIVE_INVENTORY_EXACT_SHA_CI_REQUIRED');
            const requiredJobs = new Map([
              ['Python compile and tests', 'windows-latest'],
              ['Portable Linux compile and tests', 'ubuntu-latest'],
            ]);
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            let jobs = {total_count: 0, jobs: []};
            let missing = [];
            let incompletePage = false;
            for (let attempt = 1; attempt <= 3; attempt++) {
              ({data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
              }));
              incompletePage = jobs.total_count !== jobs.jobs.length;
              missing = [];
              for (const [name, expectedLabel] of requiredJobs) {
                const job = jobs.jobs.find(j => j.name === name && j.run_id === run.id &&
                  j.status === 'completed' && j.conclusion === 'success' &&
                  Boolean(j.started_at) && Boolean(j.completed_at) &&
                  Array.isArray(j.labels) && j.labels.includes(expectedLabel));
                if (!job || !job.steps.some(s => s.name === 'Unit and negative-control tests' &&
                      s.status === 'completed' && s.conclusion === 'success')) {
                  missing.push(name);
                }
              }
              if (!incompletePage && missing.length === 0) break;
              if (attempt < 3) await sleep(5000);
            }
            if (incompletePage) throw new Error('NATIVE_INVENTORY_CI_INCOMPLETE');
            if (missing.length) {
              const summary = [...requiredJobs].map(([name, expectedLabel]) => {
                const job = jobs.jobs.find(item => item.name === name);
                const step = job && job.steps.find(
                  item => item.name === 'Unit and negative-control tests');
                return {name, found: Boolean(job), run_matches: job?.run_id === run.id,
                  status: job?.status || null, conclusion: job?.conclusion || null,
                  started: Boolean(job?.started_at), completed: Boolean(job?.completed_at),
                  expected_label: Boolean(job?.labels?.includes(expectedLabel)),
                  required_step: step ? `${step.status}/${step.conclusion}` : null};
              });
              core.info(`NATIVE_INVENTORY_CI_EVIDENCE_SUMMARY:${JSON.stringify(summary)}`);
              throw new Error('NATIVE_INVENTORY_REAL_CI_EVIDENCE_REQUIRED');
            }
            core.setOutput('admitted_at', new Date().toISOString());

      - name: Resolve main SHA and require rules 1.6.9+
        id: rules
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              branch: 'main',
            });
            const sha = branch.data.commit.sha;
            const readme = await github.rest.repos.getContent({
              owner: 'ericson-j-santos',
              repo: 'chatgpt-operational-rules',
              path: 'README.md',
              ref: sha,
            });
            const text = Buffer.from(readme.data.content, 'base64').toString('utf8');
            const match = text.match(/^Versão:\s*(\d+)\.(\d+)\.(\d+)\s*$/m);
            if (!match) {
              core.setFailed('RULES_VERSION_UNREADABLE');
              return;
            }
            const observed = match.slice(1).map(Number);
            const required = context.payload.inputs?.diagnostic === 'orchestrator-runner-preflight' ? [1, 6, 19] : [1, 6, 9];
            const sufficient = observed[0] > required[0]
              || (observed[0] === required[0] && observed[1] > required[1])
              || (observed[0] === required[0] && observed[1] === required[1] && observed[2] >= required[2]);
            if (!sufficient) {
              core.setFailed(required[2] === 19 ? 'RULES_1_6_19_REQUIRED' : `RULES_1_6_9_REQUIRED:observed=${observed.join('.')}`);
              return;
            }
            core.setOutput('sha', sha);

  orchestrator_contract:
    needs: resolve_rules
    if: inputs.diagnostic == 'orchestrator-runner-preflight'
    name: Orchestrator preflight contract on exact SHA
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      admitted_at: ${{ steps.admit.outputs.admitted_at }}
    steps:
      - name: Checkout exact runtime SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2 PyYAML==6.0.3
      - name: Focused preflight and workflow contract
        shell: pwsh
        run: python -m pytest -q tests/test_orchestrator_dev_runner_preflight.py tests/test_orchestrator_runner_preflight_workflow.py tests/test_orchestrator_local_inventory.py
      - name: Admit bounded physical pickup after contract
        id: admit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            core.setOutput('admitted_at', new Date().toISOString());

  e2e:
    needs: [resolve_rules, orchestrator_contract]
    if: ${{ !cancelled() && needs.resolve_rules.result == 'success' && inputs.lenovo_control_plane_pickup != true && (inputs.diagnostic != 'orchestrator-runner-preflight' || needs.orchestrator_contract.result == 'success') }}
    permissions:
      contents: read
      actions: read
    outputs:
      orchestrator_receipt: ${{ steps.orchestrator_proof.outputs.receipt }}
    name: Pickup on dedicated Desktop runtime runner
    # Native inventory and readback require the Desktop identity label; do not
    # retag another runner or rely on the six shared runtime labels.
    # Before dispatch, read back the complete runner registry: id 2 must be the
    # unique eligible DESKTOP-PDQK954-runtime runner, online/idle. Keep the
    # identity/TTL guard first; labels alone never prove physical host identity.
    runs-on: ${{ fromJSON('["self-hosted","Windows","X64","pc24x7","desktop-runtime","runtime-dev","desktop-pdqk954"]') }}
    timeout-minutes: 10
    env:
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      CORRELATION_ID: dedicated-runner-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: ${{ (inputs.diagnostic == 'native-postgres-inventory' || inputs.diagnostic == 'native-postgres-readback' || inputs.diagnostic == 'native-wsl-postgres-qualification') && 'artifacts/native-pg-inventory/evidence.json' || 'artifacts/dedicated-runner-e2e/evidence.json' }}
      INVENTORY_ADMITTED_AT: ${{ needs.resolve_rules.outputs.inventory_admitted_at }}
      ORCHESTRATOR_ADMITTED_AT: ${{ needs.orchestrator_contract.outputs.admitted_at }}
      ORCHESTRATOR_MAIN_SHA: ${{ needs.resolve_rules.outputs.orchestrator_main_sha }}
      ORCHESTRATOR_SOURCE_PR: ${{ needs.resolve_rules.outputs.orchestrator_source_pr }}
      ORCHESTRATOR_CI_RUN_ID: ${{ needs.resolve_rules.outputs.orchestrator_ci_run_id }}
      ORCHESTRATOR_CI_ATTEMPT: ${{ needs.resolve_rules.outputs.orchestrator_ci_attempt }}
    steps:
      - name: Reject stale orchestrator pickup before checkout or bootstrap
        if: inputs.diagnostic == 'orchestrator-runner-preflight'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const age = Date.now() - Date.parse(process.env.ORCHESTRATOR_ADMITTED_AT || '');
            if (!Number.isFinite(age) || age < 0 || age > 300000 ||
                process.env.RUNNER_NAME !== 'DESKTOP-PDQK954-runtime' ||
                require('os').hostname().toUpperCase() !== 'DESKTOP-PDQK954' ||
                process.env.GITHUB_RUN_ATTEMPT !== '1') {
              throw new Error('ORCHESTRATOR_PREFLIGHT_PICKUP_EXPIRED_OR_WRONG_HOST');
            }
            const {data: current} = await github.rest.repos.getBranch({
              ...context.repo, branch: context.ref.replace(/^refs\/heads\//, ''),
            });
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const {data: rules} = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos', repo: 'chatgpt-operational-rules', branch: 'main',
            });
            if (current.commit.sha !== context.sha || main.commit.sha !== process.env.ORCHESTRATOR_MAIN_SHA ||
                rules.commit.sha !== process.env.RULES_SHA) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_ADMISSION_MOVED');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            const matches = jobs.jobs.filter(job => job.name === 'Pickup on dedicated Desktop runtime runner');
            if (jobs.total_count !== jobs.jobs.length || matches.length !== 1 ||
                matches[0].run_id !== context.runId || matches[0].runner_id !== 2 ||
                matches[0].runner_name !== 'DESKTOP-PDQK954-runtime' ||
                matches[0].status !== 'in_progress') {
              throw new Error('ORCHESTRATOR_PREFLIGHT_RUNNER_2_REQUIRED');
            }

      - name: Reject stale native pickup before checkout or bootstrap
        if: (inputs.diagnostic == 'native-postgres-inventory' || inputs.diagnostic == 'native-postgres-readback' || inputs.diagnostic == 'native-wsl-postgres-qualification')
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const age = Date.now() - Date.parse(process.env.INVENTORY_ADMITTED_AT || '');
            if (!Number.isFinite(age) || age < 0 || age > 300000 ||
                process.env.RUNNER_NAME !== 'DESKTOP-PDQK954-runtime' ||
                require('os').hostname().toUpperCase() !== 'DESKTOP-PDQK954') {
              throw new Error('NATIVE_INVENTORY_PICKUP_EXPIRED_OR_WRONG_HOST');
            }

      - name: Checkout exact runtime SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed session and runner version preflight
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-runner",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef,
            "--require-runner-version-preflight"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          if ($null -eq $data.runner_version_preflight -or $data.runner_version_preflight.ok -ne $true) {
            throw "RUNNER_VERSION_PREFLIGHT_BLOCKED"
          }
          if ([string]::IsNullOrWhiteSpace([string]$data.runner_version_preflight.installed_version)) {
            throw "RUNNER_VERSION_EVIDENCE_MISSING"
          }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT
          "runner_version=$($data.runner_version_preflight.installed_version)" | Add-Content $env:GITHUB_OUTPUT
          "RUNNER_VERSION_OBSERVED=$($data.runner_version_preflight.installed_version)" | Add-Content $env:GITHUB_ENV
          "RUNNER_REGISTRATION_SUPPORTED=$($data.runner_version_preflight.registration_supported.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          "RUNNER_RUNTIME_SUPPORTED=$($data.runner_version_preflight.runtime_supported_now.ToString().ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          "RUNNER_DEPRECATION_API_STATUS=$($data.runner_version_preflight.deprecation_api_status)" | Add-Content $env:GITHUB_ENV

      - name: Prove exact host, repository, runner and version through Command Gateway
        if: (inputs.diagnostic != 'native-postgres-inventory' && inputs.diagnostic != 'native-postgres-readback' && inputs.diagnostic != 'native-wsl-postgres-qualification' && inputs.diagnostic != 'orchestrator-runner-preflight')
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\dedicated_runner_e2e.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Read fixed native PostgreSQL metadata through Command Gateway
        if: inputs.diagnostic == 'native-postgres-inventory'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          INVENTORY_SESSION_VALIDATED: 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\native_windows_pg_inventory.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", "-B", $script
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Read fixed PostgreSQL listener owners and legacy receipts through Command Gateway
        if: inputs.diagnostic == 'native-postgres-readback'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          INVENTORY_SESSION_VALIDATED: 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\native_windows_pg_readback.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", "-B", $script
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Qualify default WSL for native PostgreSQL through Command Gateway
        if: inputs.diagnostic == 'native-wsl-postgres-qualification'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          INVENTORY_SESSION_VALIDATED: 'true'
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\native_wsl_pg_qualification.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", "-B", $script
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Prove orchestrator readonly preflight, negative SHA and replay through Command Gateway
        id: orchestrator_proof
        if: inputs.diagnostic == 'orchestrator-runner-preflight'
        shell: python
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          import os, runpy
          module = runpy.run_path(os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "orchestrator_runner_preflight_workflow.py"))
          module["prove"]()

      - name: Upload sanitized evidence
        if: always() && (inputs.diagnostic != 'native-postgres-inventory' && inputs.diagnostic != 'native-postgres-readback' && inputs.diagnostic != 'native-wsl-postgres-qualification' && inputs.diagnostic != 'orchestrator-runner-preflight') && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dedicated-runner-e2e-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}/artifacts/dedicated-runner-e2e/evidence.json
          if-no-files-found: error
          retention-days: 30

  orchestrator_preflight_readback:
    needs: [resolve_rules, orchestrator_contract, e2e]
    if: always() && inputs.diagnostic == 'orchestrator-runner-preflight'
    name: Independent orchestrator preflight readback
    runs-on: windows-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      RECEIPT: ${{ needs.e2e.outputs.orchestrator_receipt }}
      PHYSICAL_RESULT: ${{ needs.e2e.result }}
      CONTRACT_RESULT: ${{ needs.orchestrator_contract.result }}
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      ORCHESTRATOR_MAIN_SHA: ${{ needs.resolve_rules.outputs.orchestrator_main_sha }}
      ORCHESTRATOR_SOURCE_PR: ${{ needs.resolve_rules.outputs.orchestrator_source_pr }}
      ORCHESTRATOR_CI_RUN_ID: ${{ needs.resolve_rules.outputs.orchestrator_ci_run_id }}
      ORCHESTRATOR_CI_ATTEMPT: ${{ needs.resolve_rules.outputs.orchestrator_ci_attempt }}
    steps:
      - name: Read actual jobs and require exact terminal preflight evidence
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            if (process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                process.env.PHYSICAL_RESULT !== 'success' || process.env.CONTRACT_RESULT !== 'success') {
              throw new Error('ORCHESTRATOR_PREFLIGHT_REQUIRED_JOB_FAILED');
            }
            const falseFields = [
              'execution_authorized', 'registration_performed', 'registration_token_requested',
              'runner_started', 'watchdog_changed', 'runner_version_preflight_proven',
              'physical_pickup_proven', 'continuous_operation_proven',
            ];
            const receipt = JSON.parse(process.env.RECEIPT || '{}');
            if (receipt.schema_version !== 1 || receipt.kind !== 'orchestrator-runner-readonly-preflight' ||
                receipt.source_sha !== context.sha || receipt.rules_sha !== process.env.RULES_SHA ||
                receipt.main_sha !== process.env.ORCHESTRATOR_MAIN_SHA ||
                receipt.source_pr !== Number(process.env.ORCHESTRATOR_SOURCE_PR) ||
                receipt.ci_run_id !== Number(process.env.ORCHESTRATOR_CI_RUN_ID) ||
                receipt.ci_attempt !== Number(process.env.ORCHESTRATOR_CI_ATTEMPT) ||
                receipt.run_id !== context.runId || receipt.run_attempt !== 1 ||
                receipt.correlation_id !== 'dedicated-runner-' + context.runId + '-1' ||
                receipt.host !== 'DESKTOP-PDQK954' || receipt.runner_name !== 'DESKTOP-PDQK954-runtime' ||
                receipt.runner_id !== 2 || receipt.target_repository !== 'ericson-j-santos/reqsys-engineering-orchestrator' ||
                receipt.target_environment !== 'dev' || receipt.negative_state !== 'source_sha_mismatch' ||
                receipt.negative_exit_code !== 2 || receipt.replay_identical !== true ||
                receipt.gateway_state_unchanged !== true || receipt.read_only !== true ||
                !falseFields.every(key => receipt[key] === false) ||
                !((receipt.registration_required === true && receipt.observed_target_runner_id === null) ||
                  (receipt.registration_required === false &&
                   Number.isSafeInteger(receipt.observed_target_runner_id) && receipt.observed_target_runner_id > 0))) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_RECEIPT_REJECTED');
            }
            const branchName = context.ref.replace(/^refs\/heads\//, '');
            const {data: current} = await github.rest.repos.getBranch({...context.repo, branch: branchName});
            const {data: main} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const {data: rules} = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos', repo: 'chatgpt-operational-rules', branch: 'main',
            });
            if (current.commit.sha !== context.sha || main.commit.sha !== receipt.main_sha ||
                rules.commit.sha !== receipt.rules_sha) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_MOVED');
            }
            if (receipt.source_pr > 0) {
              const {data: pull} = await github.rest.pulls.get({...context.repo, pull_number: receipt.source_pr});
              if (pull.state !== 'open' || pull.head.sha !== context.sha || pull.head.ref !== branchName ||
                  pull.head.repo?.full_name !== 'ericson-j-santos/desktop-pc24x7-runtime' ||
                  pull.base.ref !== 'main' || pull.base.sha !== receipt.main_sha) {
                throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_PR_MOVED');
              }
            } else if (branchName !== 'main' || receipt.source_sha !== receipt.main_sha) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_MAIN_REQUIRED');
            }
            const {data: latestRuns} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: context.sha,
              branch: branchName, event: 'push', per_page: 100,
            });
            const latestEligible = latestRuns.workflow_runs.filter(item =>
              item.head_sha === context.sha && item.head_branch === branchName &&
              item.event === 'push' &&
              item.repository?.full_name === 'ericson-j-santos/desktop-pc24x7-runtime');
            if (!latestEligible.length || latestEligible.some(item =>
                !Number.isSafeInteger(item.id) || item.id <= 0 ||
                !Number.isSafeInteger(item.run_attempt) || item.run_attempt <= 0 ||
                !Number.isFinite(Date.parse(item.created_at)))) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_CI_METADATA_INVALID');
            }
            latestEligible.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const latest = latestEligible[0];
            if (latest.id !== receipt.ci_run_id || latest.run_attempt !== receipt.ci_attempt ||
                latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_LATEST_CI_CHANGED');
            }
            const {data: ci} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: receipt.ci_run_id,
            });
            if (ci.head_sha !== context.sha || ci.head_branch !== branchName ||
                ci.event !== 'push' || ci.status !== 'completed' || ci.conclusion !== 'success' ||
                ci.run_attempt !== receipt.ci_attempt) {
              throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_CI_CHANGED');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.runId, filter: 'latest', per_page: 100,
            });
            if (jobs.total_count !== jobs.jobs.length) throw new Error('ORCHESTRATOR_PREFLIGHT_READBACK_INCOMPLETE');
            const required = [
              ['Pickup on dedicated Desktop runtime runner', [
                'Reject stale orchestrator pickup before checkout or bootstrap',
                'Bootstrap governed session and runner version preflight',
                'Prove orchestrator readonly preflight, negative SHA and replay through Command Gateway',
              ]],
              ['Orchestrator preflight contract on exact SHA', ['Focused preflight and workflow contract']],
            ];
            for (const [name, steps] of required) {
              const matches = jobs.jobs.filter(job => job.name === name);
              const job = matches[0];
              if (matches.length !== 1 || job.run_id !== context.runId ||
                  job.status !== 'completed' || job.conclusion !== 'success' ||
                  !job.started_at || !job.completed_at ||
                  !steps.every(name => job.steps?.some(step => step.name === name &&
                    step.status === 'completed' && step.conclusion === 'success')) ||
                  (name.startsWith('Pickup') && (job.runner_id !== 2 || job.runner_name !== 'DESKTOP-PDQK954-runtime')) ||
                  (name.startsWith('Orchestrator') && !job.labels?.includes('windows-latest'))) {
                throw new Error('ORCHESTRATOR_PREFLIGHT_REAL_TERMINAL_EVIDENCE_REQUIRED');
              }
            }
            core.info('ORCHESTRATOR_PREFLIGHT_INDEPENDENT_READBACK_OK:' + JSON.stringify(receipt));
            await core.summary.addHeading('Orchestrator read-only preflight — execution still pending')
              .addCodeBlock(JSON.stringify(receipt, null, 2), 'json').write();

  lenovo_pickup:
    needs: resolve_rules
    outputs:
      receipt_b64: ${{ steps.lenovo_proof.outputs.receipt_b64 }}
      receipt_sha256: ${{ steps.lenovo_proof.outputs.receipt_sha256 }}
    if: inputs.lenovo_control_plane_pickup == true && inputs.diagnostic == 'runner-identity'
    name: Pickup on Lenovo free control plane
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-rp23ogs]
    timeout-minutes: 5
    env:
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      CORRELATION_ID: lenovo-control-plane-pickup-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\lenovo-control-plane-pickup\evidence.json
    steps:
      - name: Checkout exact runtime SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Lenovo session and runner version preflight
        id: lenovo_session
        shell: python
        run: |
          import os, runpy
          module = runpy.run_path(os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "lenovo_control_plane_workflow.py"))
          module["bootstrap"]()

      - name: Prove Lenovo control-plane pickup through Command Gateway
        id: lenovo_proof
        shell: python
        env:
          TARGET_PATH: ${{ steps.lenovo_session.outputs.target_path }}
          SESSION_ID: ${{ steps.lenovo_session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.lenovo_session.outputs.anchor_sha }}
        run: |
          import os, runpy
          module = runpy.run_path(os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "lenovo_control_plane_workflow.py"))
          module["prove"]()
          module["emit_receipt"]()

  lenovo_readback:
    needs: [resolve_rules, lenovo_pickup]
    if: ${{ inputs.lenovo_control_plane_pickup == true && inputs.diagnostic == 'runner-identity' && needs.lenovo_pickup.result == 'success' }}
    name: Independent Lenovo pickup receipt readback
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    env:
      RECEIPT_B64: ${{ needs.lenovo_pickup.outputs.receipt_b64 }}
      RECEIPT_SHA256: ${{ needs.lenovo_pickup.outputs.receipt_sha256 }}
      EXPECTED_RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
    steps:
      - name: Verify bounded receipt and immutable run identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'ericson-j-santos/desktop-pc24x7-runtime'
          test -n "$RECEIPT_B64"
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(printf '%s' "$RECEIPT_B64" | wc -c)" -le 12000
          mkdir -p _lenovo_readback
          printf '%s' "$RECEIPT_B64" | base64 --decode > _lenovo_readback/receipt.json
          test -s _lenovo_readback/receipt.json
          test "$(wc -c < _lenovo_readback/receipt.json)" -le 8192
          test "$(sha256sum _lenovo_readback/receipt.json | cut -d' ' -f1)" = "$RECEIPT_SHA256"
          jq -e --arg sha "$GITHUB_SHA" --arg rules "$EXPECTED_RULES_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '(.contract == "lenovo-pickup-job-output-v1") and (.ok == true) and
             (.result == "LENOVO_CONTROL_PLANE_PICKUP_PROVEN") and
             (.host == "DESKTOP-RP23OGS") and
             (.runner_name == "DESKTOP-RP23OGS-runtime") and
             (.source_sha == $sha) and (.rules_sha == $rules) and
             (.run_id == $run) and (.run_attempt == $attempt) and
             (.correlation_id == ("lenovo-control-plane-pickup-" + $run + "-" + $attempt)) and
             (.session_result == "SESSION_LAUNCH_OK") and
             ((.session_id | length) > 0) and
             (.state_validated == true) and (.gateway_ok == true) and
             (.watchdog_runner_status == "process_running" or .watchdog_runner_status == "recovered") and
             (.runner_process_count == 1) and
             (.credentials_created == false) and (.production_touched == false) and
             (.reboot_performed == false)' _lenovo_readback/receipt.json >/dev/null
          echo LENOVO_RECEIPT_SHA256_VERIFIED
      - name: Independently verify physical runner and guarded steps
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          observed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          printf '%s' "$observed" | jq -e '
            (.total_count == (.jobs | length)) and
            ([.jobs[] | select(
              .name == "Pickup on Lenovo free control plane" and
              .runner_name == "DESKTOP-RP23OGS-runtime" and
              (.runner_id | type == "number" and . > 0) and
              .status == "completed" and .conclusion == "success" and
              ([.steps[] | select(.name == "Bootstrap governed Lenovo session and runner version preflight"
                and .status == "completed" and .conclusion == "success")] | length) == 1 and
              ([.steps[] | select(.name == "Prove Lenovo control-plane pickup through Command Gateway"
                and .status == "completed" and .conclusion == "success")] | length) == 1
            )] | length == 1)' >/dev/null
          printf 'Lenovo pickup verified in run %s / sha %s / digest %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RECEIPT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo LENOVO_INDEPENDENT_READBACK_OK

  queue_watchdog:
    needs: [resolve_rules, orchestrator_contract]
    if: ${{ !cancelled() && needs.resolve_rules.result == 'success' && (inputs.diagnostic != 'orchestrator-runner-preflight' || needs.orchestrator_contract.result == 'success') }}
    name: Dedicated runner queue watchdog
    runs-on: windows-latest
    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    env:
      RULES_SHA: ${{ needs.resolve_rules.outputs.rules_sha }}
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: ${{ inputs.lenovo_control_plane_pickup == true && 'Pickup on Lenovo free control plane' || 'Pickup on dedicated Desktop runtime runner' }}
      EXPECTED_RUNNER: ${{ inputs.lenovo_control_plane_pickup == true && 'DESKTOP-RP23OGS-runtime' || 'DESKTOP-PDQK954-runtime' }}
      STALL_AFTER_SECONDS: "300"
      CORRELATION_ID: dedicated-runner-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe dedicated runner pickup
        id: observe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const runId = Number(process.env.TARGET_RUN_ID);
            // Setup/resolve_rules time is not time waiting for this pickup.
            // Fix the observation anchor once; polling must never renew it.
            const anchor = new Date();
            while (true) {
              const response = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const job = response.data.jobs.find((item) => item.name === process.env.TARGET_JOB_NAME) || null;
              // A changed status alone (including skipped) is not runner pickup.
              const pickedUp = job && job.run_id === runId
                && Number.isSafeInteger(job.runner_id) && job.runner_id > 0
                && job.runner_name === process.env.EXPECTED_RUNNER
                && ['in_progress', 'completed'].includes(job.status);
              if (pickedUp) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: String(job.id),
                  correlation_id: process.env.CORRELATION_ID,
                  state: job.status === 'completed' ? 'completed' : 'running',
                  last_material_progress_at: new Date().toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              const noProgressMs = Date.now() - anchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: job ? String(job.id) : 'dedicated-runner-job-not-created',
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: anchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }
              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        shell: pwsh
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Report expired native pickup without cancellation
        if: steps.watchdog.outcome == 'failure' && (inputs.diagnostic == 'native-postgres-inventory' || inputs.diagnostic == 'native-postgres-readback' || inputs.diagnostic == 'native-wsl-postgres-qualification')
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            core.setFailed('NATIVE_INVENTORY_PICKUP_EXPIRED_NO_COLLECTION_ALLOWED');

      - name: Fail closed and cancel stalled canary
        if: steps.watchdog.outcome == 'failure' && (inputs.diagnostic != 'native-postgres-inventory' && inputs.diagnostic != 'native-postgres-readback' && inputs.diagnostic != 'native-wsl-postgres-qualification')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }
            core.setFailed(`SELF_HOSTED_RUNNER_UNAVAILABLE:${decision.no_progress_seconds}s`);
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.TARGET_RUN_ID),
            });


