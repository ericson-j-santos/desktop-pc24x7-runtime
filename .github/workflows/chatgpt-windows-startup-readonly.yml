name: ChatGPT Windows Startup Read-only Audit

on:
  push:
    branches:
      - fix/desktop-chatgpt-autostart-readonly-20261012
    paths:
      - scripts/chatgpt_windows_startup_audit.py
      - tests/test_chatgpt_windows_startup_audit.py
      - .github/workflows/chatgpt-windows-startup-readonly.yml

permissions:
  contents: read

concurrency:
  group: chatgpt-autostart-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Windows contracts and rejection tests
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run targeted offline contracts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_TEST_DEPENDENCY_FAILED' }
          python -m py_compile scripts/chatgpt_windows_startup_audit.py tests/test_chatgpt_windows_startup_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_COMPILE_FAILED' }
          python -m pytest tests/test_chatgpt_windows_startup_audit.py -q
          if ($LASTEXITCODE -ne 0) { throw 'AUDIT_CONTRACT_FAILED' }

  physical-read:
    name: Physical Desktop read-only registration audit
    needs: contracts
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev]
    timeout-minutes: 7
    env:
      RULES_SHA: f6ccb143a581e28650e9b640226f9ef671d469f2
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout pinned operational rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false
      - name: Bootstrap exact-session Command Gateway
        id: session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $launcher = Join-Path $rules 'scripts\session_launcher.py'
          $policy = Join-Path $rules 'config\command-gateway.policy.json'
          $ref = 'origin/' + $env:GITHUB_REF_NAME
          $args = @('--policy', $policy, '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', 'chatgpt-startup-readonly',
            '--correlation-id', "chatgpt-startup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            '--expected-head', '${{ github.sha }}', '--sync-ref', $ref,
            '--require-runner-version-preflight')
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { throw 'SESSION_LAUNCH_BLOCKED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or $session.state_validated -ne $true) { throw 'SESSION_IDENTITY_INVALID' }
          if ($session.head -ne '${{ github.sha }}' -or $session.runner_version_preflight.ok -ne $true) { throw 'SESSION_SHA_OR_VERSION_BLOCKED' }
          "target_path=$($session.target_path)" >> $env:GITHUB_OUTPUT
          "session_id=$($session.session_id)" >> $env:GITHUB_OUTPUT
          'SESSION_LAUNCH_OK'
      - name: Read ChatGPT Startup indicators via Gateway
        shell: pwsh
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rules = Join-Path $env:GITHUB_WORKSPACE '_rules'
          $gateway = Join-Path $rules 'scripts\command_gateway.py'
          $policy = Join-Path $rules 'config\command-gateway.policy.json'
          $args = @('--policy', $policy,
            '--correlation-id', "chatgpt-startup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '1', '--timeout', '75', '--expected-head', '${{ github.sha }}',
            '--', 'python', 'scripts/chatgpt_windows_startup_audit.py')
          & python $gateway @args
          if ($LASTEXITCODE -ne 0) { throw 'CHATGPT_AUTOSTART_AUDIT_BLOCKED' }
          $file = Join-Path $env:RUNNER_TEMP 'chatgpt-autostart-evidence.json'
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'CHATGPT_AUDIT_EVIDENCE_MISSING' }
          $evidence = Get-Content -LiteralPath $file -Raw | ConvertFrom-Json
          if ($evidence.schema_version -ne 'chatgpt-startup-audit/v1' -or
              $evidence.runtime_sha -ne '${{ github.sha }}' -or
              $evidence.github_run_id -ne "$env:GITHUB_RUN_ID" -or
              $evidence.host_confirmed -ne $true -or
              $evidence.reboot_performed -ne $false -or
              $evidence.passwords_or_run_values_read -ne $false) { throw 'CHATGPT_AUDIT_EVIDENCE_INVALID' }
          "Audit assessment: $($evidence.assessment)"
          "Runner is console session: $($evidence.runner_matches_active_console)"
          'Reboot: NOT PERFORMED'
      - name: Retain sanitized fixed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-startup-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/chatgpt-autostart-evidence.json
          if-no-files-found: warn
          retention-days: 14
