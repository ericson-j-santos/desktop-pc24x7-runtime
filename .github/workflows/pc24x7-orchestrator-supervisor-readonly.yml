name: Desktop Orchestrator Supervisor Read-only Preflight

on:
  # Explicit owner action only; code changes and schedule never probe a physical host.
  workflow_dispatch:
    inputs:
      probe_mode:
        description: 'Leitura Risk1 fixa: supervisor ou publicador ReqSys DEV'
        required: true
        type: choice
        default: supervisor
        options: [supervisor, reqsys_locator]

permissions:
  contents: read

concurrency:
  group: desktop-orchestrator-failure-inventory-20261012
  cancel-in-progress: false

jobs:
  contract:
    name: Check read-only probe and negative controls
    runs-on: windows-latest
    timeout-minutes: 6
    outputs:
      canonical_rules_sha: ${{ steps.admit.outputs.canonical_rules_sha }}
      reqsys_sha: ${{ steps.reqsys.outputs.reqsys_sha }}
      publisher_sha256: ${{ steps.reqsys.outputs.publisher_sha256 }}
    steps:
      - name: Admit owner, main and live immutable rules
        id: admit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            if (context.eventName !== 'workflow_dispatch' ||
                context.ref !== 'refs/heads/main' ||
                context.actor !== context.repo.owner ||
                context.repo.owner !== 'ericson-j-santos' ||
                context.repo.repo !== 'desktop-pc24x7-runtime' ||
                process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                process.env.GITHUB_TRIGGERING_ACTOR !== 'ericson-j-santos') {
              throw new Error('READONLY_MANUAL_SCOPE_DENIED');
            }
            const mode = context.payload.inputs?.probe_mode || 'supervisor';
            if (!['supervisor', 'reqsys_locator'].includes(mode)) {
              throw new Error('READONLY_MODE_NOT_ALLOWED');
            }
            const { data: main } = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main',
            });
            if (main.commit.sha !== context.sha) throw new Error('READONLY_MAIN_MOVED');
            const { data: rules } = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos', repo: 'chatgpt-operational-rules', branch: 'main',
            });
            const sha = String(rules.commit.sha || '').toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('READONLY_RULES_SHA_INVALID');
            core.setOutput('canonical_rules_sha', sha);
      - name: Bind current ReqSys source and public publisher SHA-256 for locator mode
        if: inputs.probe_mode == 'reqsys_locator'
        id: reqsys
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const crypto = require('crypto');
            const owner='ericson-j-santos', repo='reqsys-v2-enterprise-real';
            const {data: main} = await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const sha = String(main.commit.sha || '');
            if (!/^[0-9a-f]{40}$/.test(sha)) throw Error('REQSYS_MAIN_SHA_INVALID');
            const {data: publisher} = await github.rest.repos.getContent({
              owner, repo, path:'scripts/pc24x7_dev_locator_publisher.py', ref:sha
            });
            if (publisher.type !== 'file' || publisher.encoding !== 'base64' ||
                typeof publisher.content !== 'string') {
              throw Error('REQSYS_PUBLISHER_SOURCE_UNAVAILABLE');
            }
            const raw = Buffer.from(publisher.content.replace(/\s/g,''), 'base64');
            if (raw.length < 1024 || raw.length > 65536) {
              throw Error('REQSYS_PUBLISHER_SOURCE_SIZE_INVALID');
            }
            core.setOutput('reqsys_sha', sha);
            core.setOutput('publisher_sha256', crypto.createHash('sha256').update(raw).digest('hex'));
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and exercise read-only probe
        shell: powershell
        run: |
          python -m py_compile scripts/orchestrator_supervisor_readonly_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_orchestrator_supervisor_*.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native publisher inventory: positive, negative, replay and privacy tests
        if: inputs.probe_mode == 'reqsys_locator'
        shell: powershell
        run: |
          python -B -m unittest discover -s tests -p test_reqsys_dev_locator_risk1_inventory.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  physical_readback:
    needs: contract
    name: Inspect fixed supervisor version on dedicated Desktop runner
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev, desktop-pdqk954]
    timeout-minutes: 7
    steps:
      - name: Checkout fixed Desktop source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout approved session rules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ needs.contract.outputs.canonical_rules_sha }}
          path: _rules
          persist-credentials: false
      - name: Recheck ReqSys main SHA before physical locator inventory
        if: inputs.probe_mode == 'reqsys_locator'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          EXPECTED_REQSYS_SHA: ${{ needs.contract.outputs.reqsys_sha }}
          EXPECTED_PUBLISHER_SHA256: ${{ needs.contract.outputs.publisher_sha256 }}
        with:
          script: |
            const sha = process.env.EXPECTED_REQSYS_SHA || '';
            if (!/^[0-9a-f]{40}$/.test(sha) ||
                !/^[0-9a-f]{64}$/.test(process.env.EXPECTED_PUBLISHER_SHA256 || '')) {
              throw Error('REQSYS_LOCATOR_SOURCE_BINDING_MISSING');
            }
            const {data: main} = await github.rest.repos.getBranch({
              owner:'ericson-j-santos',repo:'reqsys-v2-enterprise-real',branch:'main'
            });
            if (main.commit.sha !== sha) throw Error('REQSYS_MAIN_SHA_DRIFT');
      - name: Bootstrap fixed identity, head, and session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'DESKTOP-PDQK954-runtime') { throw 'WRONG_RUNNER' }
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'PINNED_PYTHON_MISSING' }
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $rulesSha = (& git -C (Join-Path $env:GITHUB_WORKSPACE '_rules') rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $rulesSha -ne '${{ needs.contract.outputs.canonical_rules_sha }}') {
            throw 'READONLY_RULES_SHA_MISMATCH'
          }
          $args = @('--policy', $policy, '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', 'orch-supervisor-readonly',
            '--correlation-id', "orch-supervisor-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT",
            '--expected-head', $env:GITHUB_SHA,
            '--sync-ref', 'origin/main',
            '--require-runner-version-preflight')
          $raw = @(& $python $launcher @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'SESSION_LAUNCH_BLOCKED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or $session.state_validated -ne $true -or
              $session.head -ne $env:GITHUB_SHA -or $session.host -ne 'DESKTOP-PDQK954' -or
              $session.runner_version_preflight.ok -ne $true) { throw 'SESSION_IDENTITY_INVALID' }
          "target_path=$($session.target_path)" | Add-Content -Path $env:GITHUB_OUTPUT
          "session_id=$($session.session_id)" | Add-Content -Path $env:GITHUB_OUTPUT
      - name: Read only fixed version, status, pending marker and local worker
        if: inputs.probe_mode == 'supervisor'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $folder = Join-Path $env:TARGET_PATH 'artifacts\orch-supervisor-readonly'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $file = Join-Path $folder 'evidence.json'
          $correlation = "orch-supervisor-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $result = [ordered]@{
            schema_version = 1
            result = 'SUPERVISOR_READBACK_BLOCKED'
            host = 'DESKTOP-PDQK954'
            source_sha = $env:GITHUB_SHA
            correlation_id = $correlation
            blocker_code = 'gateway_unavailable'
            read_only = $true
            recovery_allowed = $false
            origin_cryptographically_attested = $false
            production_touched = $false
            secrets_read = $false
          }
          try {
            $args = @('--policy', $policy, '--correlation-id', $correlation,
              'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
              '--risk', '1', '--timeout', '45', '--expected-head', $env:GITHUB_SHA,
              '--', 'python', 'scripts/orchestrator_supervisor_readonly_probe.py',
              '--confirm', 'READ-DESKTOP-ORCHESTRATOR-RUNTIME-DEV',
              '--correlation-id', $correlation)
            $raw = @(& $python $gateway @args)
            $gatewayExit = $LASTEXITCODE
            if (-not $raw) { throw 'GATEWAY_EMPTY' }
            $event = @($raw)[-1] | ConvertFrom-Json
            if (-not $event.stdout) { throw 'GATEWAY_STDOUT_MISSING' }
            $observation = ([string]$event.stdout) | ConvertFrom-Json
            if ($observation.host -ne 'DESKTOP-PDQK954' -or
                $observation.repository -ne 'ericson-j-santos/desktop-pc24x7-runtime' -or
                $observation.source_sha -ne $env:GITHUB_SHA -or
                $observation.correlation_id -ne $correlation -or
                $observation.read_only -ne $true -or
                $observation.recovery_allowed -ne $false -or
                $observation.production_touched -ne $false -or
                $observation.secrets_read -ne $false) { throw 'PROBE_IDENTITY_INVALID' }
            $result = $observation
            if ($gatewayExit -ne 0 -or $event.gateway_exit_code -ne 0 -or
                $event.result -ne 'ok' -or $event.state_changed -ne $false -or
                $observation.result -ne 'SUPERVISOR_READBACK_OBSERVED') {
              throw 'READBACK_NOT_READY'
            }
            Write-Host 'SUPERVISOR_READBACK_OBSERVED'
          } catch {
            Write-Host 'SUPERVISOR_READBACK_BLOCKED'
          } finally {
            $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $file -Encoding utf8
          }
          if ($result.result -ne 'SUPERVISOR_READBACK_OBSERVED') { throw 'SUPERVISOR_READBACK_BLOCKED' }
      - name: Read fixed ReqSys DEV locator publisher, task and ingress via Gateway Risk1
        if: inputs.probe_mode == 'reqsys_locator'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          REQSYS_SHA: ${{ needs.contract.outputs.reqsys_sha }}
          PUBLISHER_SHA256: ${{ needs.contract.outputs.publisher_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:USERPROFILE '.cache\codex-runtimes\codex-primary-runtime\dependencies\python\python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'PINNED_PYTHON_MISSING' }
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $cid = "reqsys1596-locator-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $args = @('--policy', $policy, '--correlation-id', $cid,
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '1', '--timeout', '60', '--expected-head', $env:GITHUB_SHA,
            '--', 'python', '-B', 'scripts/reqsys_dev_locator_risk1_inventory.py',
            '--expected-head', $env:GITHUB_SHA,
            '--expected-reqsys-sha', $env:REQSYS_SHA,
            '--expected-publisher-sha256', $env:PUBLISHER_SHA256,
            '--correlation-id', $cid)
          $raw = @(& $python $gateway @args)
          if ($LASTEXITCODE -ne 0 -or -not $raw) { throw 'LOCATOR_RISK1_GATEWAY_BLOCKED' }
          $event = @($raw)[-1] | ConvertFrom-Json
          if ($event.result -ne 'ok' -or $event.gateway_exit_code -ne 0 -or
              $event.state_changed -ne $false -or -not $event.stdout) {
            throw 'LOCATOR_RISK1_GATEWAY_RECEIPT_INVALID'
          }
          $report = ([string]$event.stdout) | ConvertFrom-Json
          $receiptFile = Join-Path $env:TARGET_PATH 'artifacts\reqsys-dev-locator-readonly\evidence.json'
          if (-not (Test-Path -LiteralPath $receiptFile -PathType Leaf)) {
            throw 'LOCATOR_RISK1_EVIDENCE_MISSING'
          }
          $readback = Get-Content -LiteralPath $receiptFile -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($r in @($report, $readback)) {
            if ($r.result -ne 'LOCATOR_RISK1_INVENTORY_OBSERVED' -or
                $r.host -ne 'DESKTOP-PDQK954' -or
                $r.repository -ne 'ericson-j-santos/desktop-pc24x7-runtime' -or
                $r.expected_source_sha -ne $env:GITHUB_SHA -or
                $r.expected_reqsys_main_sha -ne $env:REQSYS_SHA -or
                $r.correlation_id -ne $cid -or
                $r.read_only -ne $true -or $r.ready_for_dev -ne $false -or
                $r.runtime_deployed_or_modified -ne $false -or
                $r.secrets_read_or_emitted -ne $false -or
                $r.locator_signature_independently_verified -ne $false) {
              throw 'LOCATOR_RISK1_EVIDENCE_IDENTITY_INVALID'
            }
          }
          if ($report.observation_epoch -ne $readback.observation_epoch -or
              $report.files.publisher_script.sha256 -ne $readback.files.publisher_script.sha256) {
            throw 'LOCATOR_RISK1_READBACK_CHANGED'
          }
          Write-Host 'LOCATOR_RISK1_INVENTORY_OBSERVED_NO_OPERATIONAL_ACCEPTANCE'
      - name: Upload only sanitized ReqSys DEV locator inventory receipt
        if: always() && inputs.probe_mode == 'reqsys_locator' && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reqsys-dev-locator-risk1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.session.outputs.target_path }}/artifacts/reqsys-dev-locator-readonly/evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve only sanitized read-only evidence
        if: always() && inputs.probe_mode == 'supervisor' && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-orchestrator-supervisor-readonly
          path: ${{ steps.session.outputs.target_path }}/artifacts/orch-supervisor-readonly/evidence.json
          if-no-files-found: warn
          retention-days: 7
