name: TODO Notion encrypted backup (Desktop independent)

on:
  pull_request:
    paths:
      - scripts/todo_notion_*.py
      - scripts/todo_hosted_backup.py
      - scripts/pc24x7_todo_sealed.py
      - scripts/pc24x7_todo_recovery.py
      - tests/test_todo_notion_*.py
      - tests/notion_snapshot_fixture.py
      - tests/notion_backup_test_support.py
      - tests/e2e_todo_notion_backup.py
      - docs/todo-notion-backup.md
      - .github/workflows/todo-notion-backup.yml
  push:
    branches: [main, feat/todo-free-recovery-20261016]
    paths:
      - scripts/todo_notion_*.py
      - scripts/todo_hosted_backup.py
      - scripts/pc24x7_todo_sealed.py
      - scripts/pc24x7_todo_recovery.py
      - tests/test_todo_notion_*.py
      - tests/notion_snapshot_fixture.py
      - tests/notion_backup_test_support.py
      - tests/e2e_todo_notion_backup.py
      - docs/todo-notion-backup.md
      - .github/workflows/todo-notion-backup.yml
  workflow_dispatch:
  schedule:
    - cron: "43 4 * * *"

permissions:
  contents: read

concurrency:
  group: todo-notion-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety:
    name: Notion backup synthetic safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 cryptography==50.0.2
      - name: Compile and run positive, negative and replay tests
        env:
          PYTHONPATH: scripts
        run: |
          python -m py_compile scripts/todo_notion_*.py
          python -m pytest -v -ra tests/test_todo_notion_snapshot.py tests/test_todo_notion_sealed.py tests/test_todo_notion_hosted_backup.py tests/test_todo_notion_restore.py tests/test_todo_notion_workflow.py tests/test_todo_neon_retired.py

  backup:
    name: Capture current Notion source and verify encrypted external copy
    needs: safety
    if: >-
      github.repository == 'ericson-j-santos/desktop-pc24x7-runtime' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.TODO_NOTION_SCHEDULE_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: todo-notion-backup
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TODO_NOTION_READ_TOKEN: ${{ secrets.TODO_NOTION_READ_TOKEN }}
      TODO_NOTION_DATABASE_ID: ${{ secrets.TODO_NOTION_DATABASE_ID }}
      TODO_NOTION_DATA_SOURCE_ID: ${{ secrets.TODO_NOTION_DATA_SOURCE_ID }}
      TODO_NOTION_MIN_PAGES: ${{ vars.TODO_NOTION_MIN_PAGES }}
      TODO_BACKUP_RECIPIENT_PEM_B64: ${{ secrets.TODO_BACKUP_RECIPIENT_PEM_B64 }}
      TODO_BACKUP_RECIPIENT_SHA256: ${{ vars.TODO_BACKUP_RECIPIENT_SHA256 }}
      TODO_BACKUP_CUSTODY_APPROVAL: ${{ vars.TODO_BACKUP_CUSTODY_APPROVAL }}
      PYTHONPATH: scripts
    steps:
      - name: Checkout main without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install exact encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Capture, encrypt, upload and independently download
        run: python scripts/todo_notion_hosted_backup.py
      # No private key, plaintext artifact, cache or local/self-hosted runner.
      # Schedule remains gated until an independent real restore is evidenced.
