name: Portfolio Bridge DEV Read-only Preflight

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/portfolio-bridge-preflight-dev.yml
      - scripts/portfolio_bridge_preflight_dev.py
      - tests/test_portfolio_bridge_preflight_dev.py
  push:
    branches: [main]
    paths:
      - .github/workflows/portfolio-bridge-preflight-dev.yml
      - scripts/portfolio_bridge_preflight_dev.py
      - tests/test_portfolio_bridge_preflight_dev.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-bridge-dev-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare_runner:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Ensure dedicated Desktop runner labels
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev]
    timeout-minutes: 10
    env:
      RULES_SHA: cb340976ac9895fe572ff0321a4f68bbec99eceb
      SESSION_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      SESSION_SYNC_REF: origin/${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      CORRELATION_ID: portfolio-runner-admission-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Assert exact Desktop host before checkout
        uses: actions/github-script@v7
        with:
          script: |
            const expectedHost = 'DESKTOP-PDQK954';
            const actualHost = String(process.env.COMPUTERNAME || '').toUpperCase();
            if (actualHost !== expectedHost) {
              core.setFailed('DESKTOP_BOOTSTRAP_HOST_MISMATCH');
            }

      - name: Checkout Desktop runtime exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SESSION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session for runner repair
        id: prepare_session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $anchorSha = $env:SESSION_SOURCE_SHA
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "portfolio-runner-admission",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $env:SESSION_SYNC_REF,
            "--require-runner-version-preflight"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Repair runner label contract through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.prepare_session.outputs.target_path }}
          SESSION_ID: ${{ steps.prepare_session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.prepare_session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $runtimeScript = Join-Path $env:GITHUB_WORKSPACE "scripts\\activate_desktop_runtime_runner.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "180",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $runtimeScript,
            "--confirm", "ACTIVATE-DESKTOP-RUNTIME-RUNNER",
            "--source-sha", $env:SESSION_SOURCE_SHA,
            "--non-interactive-auth"
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

  preflight:
    needs: prepare_runner
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Governed PC24x7 portfolio bridge dry-run
    runs-on: [self-hosted, Windows, X64, pc24x7, desktop-runtime, runtime-dev]
    timeout-minutes: 8
    env:
      RULES_SHA: cb340976ac9895fe572ff0321a4f68bbec99eceb
      WORKER_POOL_SHA: 5dd070281f6016bf5ba05be93f2fd4cbf603ef1e
      PORTFOLIO_ENV: dev
      WORKER_POOL_ROOT: ${{ github.workspace }}/external/engineering-worker-pool
      SESSION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SESSION_SYNC_REF: origin/${{ github.event.pull_request.head.ref || github.ref_name }}
      CORRELATION_ID: portfolio-preflight-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Assert exact Desktop host before checkout
        uses: actions/github-script@v7
        with:
          script: |
            const expectedHost = 'DESKTOP-PDQK954';
            const actualHost = String(process.env.COMPUTERNAME || '').toUpperCase();
            if (actualHost !== expectedHost) {
              core.setFailed('DESKTOP_BOOTSTRAP_HOST_MISMATCH');
            }

      - name: Checkout Desktop runtime exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SESSION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout canonical rules pinned to verified main
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Worker Pool pinned to verified main
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/engineering-worker-pool
          ref: ${{ env.WORKER_POOL_SHA }}
          path: external/engineering-worker-pool
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $args = @(
            '--policy', $policy,
            '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', 'portfolio-readonly',
            '--correlation-id', $env:CORRELATION_ID,
            '--expected-head', $env:SESSION_SOURCE_SHA,
            '--sync-ref', $env:SESSION_SYNC_REF,
            '--require-runner-version-preflight'
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or $session.state_validated -ne $true) { throw 'SESSION_LAUNCH_BLOCKED' }
          if ($session.head -ne $env:SESSION_SOURCE_SHA) { throw 'SESSION_HEAD_MISMATCH' }
          "target_path=$($session.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($session.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Inspect DEV token references and Worker Pool through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $probe = Join-Path $env:GITHUB_WORKSPACE 'scripts\portfolio_bridge_preflight_dev.py'
          $args = @(
            '--policy', $policy,
            '--correlation-id', $env:CORRELATION_ID,
            'run',
            '--cwd', $env:TARGET_PATH,
            '--session-id', $env:SESSION_ID,
            '--risk', '1',
            '--timeout', '120',
            '--expected-head', $env:SESSION_SOURCE_SHA,
            '--', 'python', $probe
          )
          & python $gateway @args
          exit $LASTEXITCODE

      # Read-only: no task submission, no workflow tokens, and no deploy.

  prepare_runner_watchdog:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Ensure dedicated Desktop runner labels queue watchdog
    runs-on: windows-latest

    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    env:
      RULES_SHA: cb340976ac9895fe572ff0321a4f68bbec99eceb
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Ensure dedicated Desktop runner labels
      STALL_AFTER_SECONDS: "300"
      CORRELATION_ID: portfolio-runner-watchdog-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe physical runner pickup
        id: observe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const runId = Number(process.env.TARGET_RUN_ID);
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('PHYSICAL_RUN_ID_INVALID');
              return;
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const progressAnchor = new Date(runResponse.data.created_at || Date.now());

            while (true) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const targetJob = jobsResponse.data.jobs.find(
                (job) => job.name === process.env.TARGET_JOB_NAME,
              ) || null;

              if (
                targetJob &&
                (targetJob.status !== 'queued' || Number(targetJob.runner_id || 0) > 0)
              ) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: String(targetJob.id),
                  correlation_id: process.env.CORRELATION_ID,
                  state: targetJob.status === 'completed' ? 'completed' : 'running',
                  last_material_progress_at: new Date().toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }

              const noProgressMs = Date.now() - progressAnchor.getTime();
              if (noProgressMs >= stallMs) {
                fs.writeFileSync('progress-watchdog-input.json', JSON.stringify({
                  task_id: targetJob ? String(targetJob.id) : 'physical-runner-job-not-created',
                  correlation_id: process.env.CORRELATION_ID,
                  state: 'queued',
                  last_material_progress_at: progressAnchor.toISOString(),
                  last_observation_at: new Date().toISOString(),
                  stall_after_seconds: Number(process.env.STALL_AFTER_SECONDS),
                  alternative_route_available: false,
                }));
                return;
              }

              await sleep(Math.min(15000, stallMs - noProgressMs));
            }

      - name: Evaluate canonical progress watchdog
        id: watchdog
        continue-on-error: true
        shell: pwsh
        run: python _rules/scripts/progress_watchdog.py --input progress-watchdog-input.json --output progress-watchdog-output.json

      - name: Fail closed and cancel stalled physical run
        if: steps.watchdog.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('progress-watchdog-output.json')) {
              core.setFailed('PROGRESS_WATCHDOG_EVIDENCE_MISSING');
              return;
            }
            const decision = JSON.parse(fs.readFileSync('progress-watchdog-output.json', 'utf8'));
            if (decision.decision !== 'block') {
              core.setFailed(`PROGRESS_WATCHDOG_INVALID_DECISION:${decision.decision || 'missing'}`);
              return;
            }

            core.setFailed(
              `SELF_HOSTED_RUNNER_UNAVAILABLE: sem progresso material por ${decision.no_progress_seconds}s`,
            );
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.TARGET_RUN_ID),
            });

  preflight_runner_watchdog:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Governed PC24x7 portfolio bridge dry-run queue watchdog
    runs-on: windows-latest
    needs: prepare_runner

    timeout-minutes: 7
    permissions:
      actions: write
      contents: read
    env:
      RULES_SHA: cb340976ac9895fe572ff0321a4f68bbec99eceb
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Governed PC24x7 portfolio bridge dry-run
      STALL_AFTER_SECONDS: "300"
      CORRELATION_ID: portfolio-runner-watchdog-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical progress watchdog
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Observe physical runner pickup
        id: observe
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const stallMs = Number(process.env.STALL_AFTER_SECONDS) * 1000;
            const runId = Number(process.env.TARGET_RUN_ID);
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('PHYSICAL_RUN_ID_INVALID');
              return;
            }

            const runResponse = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const progressAnchor = new Date(runResponse.data.created_at || Date.now());

            while (true) {
              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
